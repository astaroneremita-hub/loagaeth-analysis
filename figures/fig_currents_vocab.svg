ht="400">11</text><text x="24" y="315" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">CHADAX</text><rect x="245.0" y="304" width="15.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="304" width="10.0" height="14" rx="2" fill="#1D9E75"/><text x="239.0" y="315" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">6</text><text x="280.0" y="315" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">4</text><text x="24" y="337" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">OXAD</text><rect x="167.5" y="326" width="92.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="326" width="35.0" height="14" rx="2" fill="#1D9E75"/><text x="161.5" y="337" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">37</text><text x="305.0" y="337" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">14</text><text x="24" y="359" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">NOCHAP</text><rect x="247.5" y="348" width="12.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="348" width="32.5" height="14" rx="2" fill="#1D9E75"/><text x="241.5" y="359" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">5</text><text x="302.5" y="359" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">13</text><text x="24" y="381" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ALGETH</text><rect x="222.5" y="370" width="37.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="370" width="40.0" height="14" rx="2" fill="#1D9E75"/><text x="216.5" y="381" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">15</text><text x="310.0" y="381" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">16</text><text x="24" y="403" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ADNOCHA</text><rect x="240.0" y="392" width="20.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="392" width="30.0" height="14" rx="2" fill="#1D9E75"/><text x="234.0" y="403" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">8</text><text x="300.0" y="403" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">12</text><text x="24" y="418" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">The two currents share fewer formulas than any random split of the same lines: two vocabularies,</text><text x="24" y="434" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">with ANZACH, ACLAX, OXAD leaning ↘ and NOCHAP, CHASTOR leaning ← — like the two houses.</text></svg>