<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário de Nomes — Loagaeth</title>
<style>
:root{--bg:#f7f6f1;--card:#fff;--ink:#1b1a17;--mut:#6c6b62;--line:#e4e2d8;--ac:#8a6d2f;--nm:#8a2f7d;
 --fogo:#c0392b;--terra:#6b8e23;--ar:#2f80c0;--agua:#1f7a6b;--vel:#7a7a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13120c;--card:#1e1d15;--ink:#ece9da;--mut:#9a988a;--line:#322f27;--ac:#d6b96a;--nm:#d66ac4;--fogo:#e06a5a;--terra:#a7c65a;--ar:#6ab6e0;--agua:#5ac4b0;--vel:#9a9a9a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px 18px 60px}
h1{font-size:22px;font-weight:700;margin:0 0 2px;display:inline-block}
h2{font-size:16px;font-weight:700;margin:24px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
#lang{cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:3px 12px;font-size:12px;font-weight:600;float:right}
.sub{color:var(--mut);margin:0 0 6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600}
.nm{color:var(--nm);font-weight:700;font-family:ui-monospace,monospace}
.parse{font-family:ui-monospace,monospace}
.el{font-weight:700;font-size:11px;border-radius:5px;padding:1px 6px;color:#fff}
.el.Fogo{background:var(--fogo)}.el.Terra{background:var(--terra)}.el.Ar{background:var(--ar)}.el.Agua{background:var(--agua)}.el\\?{background:var(--vel)}
.note{color:var(--mut);font-size:12px}
.mg{font-size:13px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px;font-family:ui-monospace,monospace;font-size:12px}
.warn{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut);margin:8px 0}
</style>
</head>
<body>
<span id="lang">EN</span>
<h1 id="h1">Dicionário de Nomes</h1>
<p class="sub" id="sub">A tradução do léxico-núcleo pelo sistema nativo de correspondências — cada nome decomposto, glosado e situado.</p>
<div class="warn" id="warn"></div>
<div id="body"></div>
<script>
var D=null,LG=(localStorage.getItem('atlas_lang')||'pt');
var S={pt:{lang:'EN',h1:'Dicionário de Nomes',
 sub:'A tradução do léxico-núcleo pelo sistema nativo de correspondências — cada nome decomposto, glosado e situado.',
 warn:'Honesto: não há pedra de Roseta. Esta tradução é a LEITURA DE CORRESPONDÊNCIA — cada letra enoquiana tem elemento e planeta (Dee/Golden Dawn), então o sentido de um nome é sua composição elemental (sua natureza como poder), do jeito que a tradição enoquiana sempre leu os nomes. Não é uma glosa inventada; é derivada do sistema de letras e dos atributos medidos.',
 h_dom:'Os quatro domínios',h_root:'Dicionário de raízes',h_aff:'Afixos (moduladores)',h_lex:'Léxico-núcleo traduzido',
 root:'Raiz',el:'Elemento',dom:'Domínio',nat:'Natureza',
 name:'Nome',parse:'Parse',force:'Força',sheets:'Folhas',mean:'Sentido',planet:'Regente',
 h_hier:'Hierarquia por elemento',hier:'Os poderes supremos são do Ar (palavra/mente): força e ubiquidade médias mais altas, liderados por NOCHA. A massa é Terra (corpo). Leitura: o Loagaeth é o livro da Palavra — o Verbo (Ar) reina sobre a matéria (Terra).',
 pattern:'Padrão: o afixo modula o elemento do nome — AD- (Terra) aterra, -P (Água) aguar. Derivação = modulação elemental.'},
 en:{lang:'PT',h1:'Dictionary of Names',
 sub:'The translation of the core lexicon by the native correspondence system — each name parsed, glossed and placed.',
 warn:'Honest: there is no Rosetta stone. This translation is the CORRESPONDENCE READING — each Enochian letter carries an element and planet (Dee/Golden Dawn), so a name’s meaning is its elemental composition (its nature as a power), the way the Enochian tradition has always read names. It is not an invented gloss; it is derived from the letter system and the measured attributes.',
 h_dom:'The four domains',h_root:'Root dictionary',h_aff:'Affixes (modulators)',h_lex:'Translated core lexicon',
 root:'Root',el:'Element',dom:'Domain',nat:'Nature',
 name:'Name',parse:'Parse',force:'Force',sheets:'Sheets',mean:'Meaning',planet:'Ruler',
 h_hier:'Hierarchy by element',hier:'The supreme powers are of Air (word/mind): highest mean force and ubiquity, led by NOCHA. The mass is Earth (body). Reading: the Loagaeth is the book of the Word — the Logos (Air) rules over matter (Earth).',
 pattern:'Pattern: the affix modulates the name’s element — AD- (Earth) earths it, -P (Water) waters it. Derivation = elemental modulation.'}};
function T(k){return S[LG][k]}
function elc(e){return e==='?'?'vel':e}
fetch('name_translation.json').then(r=>r.json()).then(d=>{D=d;render()}).catch(()=>{document.getElementById('body').innerHTML='Abra por http://localhost:8860/';});
document.getElementById('lang').onclick=()=>{LG=LG==='pt'?'en':'pt';localStorage.setItem('atlas_lang',LG);render()};
function dom(x){return LG==='pt'?x.domain_pt:x.domain_en}
function render(){
 document.getElementById('lang').textContent=T('lang');document.getElementById('h1').textContent=T('h1');
 document.getElementById('sub').textContent=T('sub');document.getElementById('warn').textContent=T('warn');
 var L=D.legend,h='';
 // domains
 h+='<h2>'+T('h_dom')+'</h2><div class=card>';
 ['Fogo','Terra','Ar','Agua'].forEach(e=>{h+='<span class="el '+e+'">'+e+'</span> <span class=mg>'+(LG==='pt'?L.domains_pt[e]:L.domains_en[e])+'</span> &nbsp; ';});
 h+='</div>';
 // hierarchy
 if(D.element_hierarchy){h+='<h2>'+T('h_hier')+'</h2><div class=card><div class=note>'+T('hier')+'</div><table><tr><th>'+T('el')+'</th><th>n</th><th>'+T('force')+'</th><th>'+T('sheets')+'</th></tr>';
  ['Ar','Agua','Terra','Fogo'].forEach(e=>{var x=D.element_hierarchy[e];if(x)h+='<tr><td><span class="el '+e+'">'+e+'</span></td><td>'+x.n+'</td><td>'+x.mean_force+'</td><td>'+x.mean_tables+'</td></tr>';});
  h+='</table></div>';}
 // roots
 h+='<h2>'+T('h_root')+'</h2><div class=card><table><tr><th>'+T('root')+'</th><th>'+T('el')+'</th><th>'+T('dom')+'</th><th>'+T('nat')+'</th></tr>';
 var R=D.morphemes.roots;
 Object.keys(R).forEach(k=>{var x=R[k];h+='<tr><td class=nm>'+k+'</td><td><span class="el '+x.element+'">'+x.element+'</span></td><td class=mg>'+dom(x)+'</td><td class=note>'+x.nature_pt+'</td></tr>';});
 h+='</table></div>';
 // affixes
 h+='<h2>'+T('h_aff')+'</h2><div class=card><div class=note>'+T('pattern')+'</div><br>';
 var P=D.morphemes.prefixes,SU=D.morphemes.suffixes;
 h+='<b>'+(LG==='pt'?'Prefixos':'Prefixes')+':</b> '+Object.keys(P).filter(k=>P[k]).map(k=>'<span class=chip>'+k+'- <span class="el '+P[k].element+'">'+P[k].element+'</span></span>').join('');
 h+='<br><br><b>'+(LG==='pt'?'Sufixos':'Suffixes')+':</b> '+Object.keys(SU).filter(k=>SU[k]).map(k=>'<span class=chip>-'+k+' <span class="el '+SU[k].element+'">'+SU[k].element+'</span></span>').join('');
 h+='</div>';
 // lexicon
 h+='<h2>'+T('h_lex')+'</h2><div class=card><table><tr><th>'+T('name')+'</th><th>'+T('parse')+'</th><th>'+T('el')+'</th><th>'+T('planet')+'</th><th>'+T('force')+'</th><th>'+T('sheets')+'</th><th>'+T('mean')+'</th></tr>';
 D.names.forEach(x=>{var p=x.parse;var parse=[p.prefix,p.root,p.suffix].filter(Boolean).join('·');var pl=(x.planets&&x.planets[0])||'—';
  h+='<tr><td class=nm>'+x.name+'</td><td class=parse>'+parse+'</td><td><span class="el '+x.whole_element+'">'+x.whole_element+'</span></td><td class=note>'+pl+'</td><td>'+(x.force||'—')+'</td><td>'+(x.tables||'—')+'</td><td class=mg>'+x.meaning_en+'</td></tr>';});
 h+='</table></div>';
 document.getElementById('body').innerHTML=h;
}
</script>
</body>
</html>
