<svg xmlns="http://www.w3.org/2000/svg" width="813" height="336" viewBox="0 0 813 336" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Two houses that alternate across the tables</title><rect x="0" y="0" width="813" height="336" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Two houses that alternate across the tables</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">The NOCHA house leads the first half; the GETH/ACLAX house holds or grows in the second.</text><rect x="50" y="230.0" width="18" height="1" rx="2" fill="#534AB7"/><rect x="72" y="230.0" width="18" height="1" rx="2" fill="#7F77DD"/><rect x="94" y="209.2" width="18" height="20.8" rx="2" fill="#AFA9EC"/><rect x="116" y="222.0" width="18" height="8.0" rx="2" fill="#1D9E75"/><rect x="138" y="230.0" width="18" height="1" rx="2" fill="#5DCAA5"/><text x="102" y="248" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400">opening</text><rect x="190" y="90.0" width="18" height="140.0" rx="2" fill="#534AB7"/><rect x="212" y="195.6" width="18" height="34.4" rx="2" fill="#7F77DD"/><rect x="234" y="165.2" width="18" height="64.80000000000001" rx="2" fill="#AFA9EC"/><rect x="256" y="167.6" width="18" height="62.400000000000006" rx="2" fill="#1D9E75"/><rect x="278" y="131.6" width="18" height="98.4" rx="2" fill="#5DCAA5"/><text x="242" y="248" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400">heartland</text><rect x="330" y="212.4" width="18" height="17.6" rx="2" fill="#534AB7"/><rect x="352" y="216.4" width="18" height="13.600000000000001" rx="2" fill="#7F77DD"/><rect x="374" y="218.8" width="18" height="11.200000000000001" rx="2" fill="#AFA9EC"/><rect x="396" y="147.6" width="18" height="82.4" rx="2" fill="#1D9E75"/><rect x="418" y="145.2" width="18" height="84.80000000000001" rx="2" fill="#5DCAA5"/><text x="382" y="248" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400">diamonds</text><rect x="470" y="230.0" width="18" height="1" rx="2" fill="#534AB7"/><rect x="492" y="230.0" width="18" height="1" rx="2" fill="#7F77DD"/><rect x="514" y="230.0" width="18" height="1" rx="2" fill="#AFA9EC"/><rect x="536" y="230.0" width="18" height="1" rx="2" fill="#1D9E75"/><rect x="558" y="230.0" width="18" height="1" rx="2" fill="#5DCAA5"/><text x="522" y="248" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400">end</text><line x1="46" y1="230" x2="610" y2="230" stroke="#C3C2B7"/><rect x="50" y="264" width="12" height="12" rx="2" fill="#534AB7"/><text x="68" y="274" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">ADNOCHA</text><rect x="125" y="264" width="12" height="12" rx="2" fill="#7F77DD"/><text x="143" y="274" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">NOCHAPH</text><rect x="200" y="264" width="12" height="12" rx="2" fill="#AFA9EC"/><text x="218" y="274" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">NODAX</text><rect x="261" y="264" width="12" height="12" rx="2" fill="#1D9E75"/><text x="279" y="274" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">ALGETH</text><rect x="329" y="264" width="12" height="12" rx="2" fill="#5DCAA5"/><text x="347" y="274" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">ACLAX</text><text x="50" y="302" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Beyond overall density they exclude each other table by table — ADNOCHA × ACLAX r = -0.58 (heartland), -0.66 (diamonds).</text><text x="50" y="318" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Purple = NOCHA house, green = GETH/ACLAX house. Bars: occurrences per 1000 letters in each segment.</text></svg>