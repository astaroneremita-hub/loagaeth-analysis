<style>

@media(prefers-color-scheme:light){:root{--bg:#f7f6f1;--card:#fff;--ink:#1b1a17;--mut:#6c6b62;--line:#e4e2d8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,Roboto,Arial}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 70px}
a.home{color:#5bb3e0;text-decoration:none;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.lang{display:flex;gap:4px}
.lang button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.lang button.on{border-color:var(--ac);color:var(--ac)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
input,.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:12.5px}
input{width:200px}
.chip{cursor:pointer;user-select:none}.chip.off{opacity:.4}
.tot{color:var(--mut);font-size:12px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ac);margin:22px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.f{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:9px;padding:9px 12px;margin:7px 0}
.f.real{border-left-color:var(--real)}.f.ref{border-left-color:var(--ref)}.f.desc{border-left-color:var(--desc)}
.f .id{font:700 11px ui-monospace,monospace;color:var(--mut);min-width:46px}
.f .bd{flex:1}.f .ti{font-weight:600}.f .de{color:var(--mut);font-size:12.5px;margin-top:2px}
.f .inf{font-size:12px;margin-top:4px;color:var(--ac);font-style:italic;opacity:.92}
.f .inf::before{content:"↳ ";opacity:.6}
.f a{color:#5bb3e0;text-decoration:none;font-size:11.5px}
.f .tag{font:700 10px ui-monospace;padding:1px 7px;border-radius:9px;background:rgba(127,127,127,.15);white-space:nowrap}
.f.real .tag{color:var(--real)}.f.ref .tag{color:var(--ref)}.f.desc .tag{color:var(--desc)}
.note{color:var(--mut);font-size:12.5px;margin-top:20px;border-left:3px solid var(--line);padding-left:10px}
</style>
</head>

let lang="pt",on={real:1,ref:1,desc:1},q="";
const el=document.getElementById("list");
const SECORD=["nat","gen","geo","gene","som","fro","num","ele","oc","lex"];
function render(){
  document.getElementById("h1").textContent=lang==="pt"?"Catálogo dos achados":"Catalogue of findings";
  document.getElementById("sub").textContent=TXT.sub[lang];
  document.getElementById("footnote").textContent=TXT.foot[lang];
  document.querySelectorAll(".vl").forEach((e,i)=>e.textContent=TXT.vl[lang][i]);
  el.innerHTML="";let n=0;
  for(const key of SECORD){
    const items=D.filter(([id,v,sc,L])=>L[lang][0]===key&&on[v]&&((id+L[lang][1]+L[lang][2]).toLowerCase().includes(q)));
    if(!items.length)continue;
    const h=document.createElement("h2");h.textContent=SEC[key][lang];el.appendChild(h);
    for(const [id,v,sc,L] of items){n++;
      const [,ti,me,inf]=L[lang];
      const d=document.createElement("div");d.className="f "+v;
      d.innerHTML=`<span class="id">#${id}</span><div class="bd"><div class="ti">${ti}</div>`+
        `<div class="de">${me}${sc?` · <a href="${sc}">${lang==="pt"?"ver tela":"view"} ↗</a>`:""}</div>`+
        (inf?`<div class="inf">${inf}</div>`:"")+`</div>`+
        `<span class="tag">${VN[v][lang]}</span>`;el.appendChild(d);}
  }
  document.getElementById("tot").textContent=n+(lang==="pt"?" achados":" findings");
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));
  document.documentElement.lang=lang==="pt"?"pt-BR":"en";render();});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{on[c.dataset.v]=!on[c.dataset.v];c.classList.toggle("off",!on[c.dataset.v]);render();});
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
