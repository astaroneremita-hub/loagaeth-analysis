<svg xmlns="http://www.w3.org/2000/svg" width="676" height="342" viewBox="0 0 676 342" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>A dialect map of the book</title><rect x="0" y="0" width="676" height="342" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">A dialect map of the book</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Cross-reading letter models trained on each realm.</text><text x="213.0" y="92" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">opening</text><text x="299.0" y="92" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">heartland</text><text x="385.0" y="92" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">decoded 26-28</text><text x="471.0" y="92" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">diamonds</text><text x="557.0" y="92" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">end</text><text x="162" y="121" font-size="11" fill="#2C2C2A" text-anchor="end" font-weight="400">model of opening</text><rect x="172" y="100" width="82" height="30" rx="3" fill="rgb(112,103,193)"/><text x="213.0" y="120" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.41</text><rect x="258" y="100" width="82" height="30" rx="3" fill="rgb(120,111,197)"/><text x="299.0" y="120" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.60</text><rect x="344" y="100" width="82" height="30" rx="3" fill="rgb(142,133,205)"/><text x="385.0" y="120" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.10</text><rect x="430" y="100" width="82" height="30" rx="3" fill="rgb(159,150,211)"/><text x="471.0" y="120" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.49</text><rect x="516" y="100" width="82" height="30" rx="3" fill="rgb(243,234,243)"/><text x="557.0" y="120" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">6.36</text><text x="162" y="155" font-size="11" fill="#2C2C2A" text-anchor="end" font-weight="400">model of heartland</text><rect x="172" y="134" width="82" height="30" rx="3" fill="rgb(121,112,197)"/><text x="213.0" y="154" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.62</text><rect x="258" y="134" width="82" height="30" rx="3" fill="rgb(83,74,183)"/><text x="299.0" y="154" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">2.75</text><rect x="344" y="134" width="82" height="30" rx="3" fill="rgb(111,102,193)"/><text x="385.0" y="154" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.40</text><rect x="430" y="134" width="82" height="30" rx="3" fill="rgb(120,111,197)"/><text x="471.0" y="154" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.61</text><rect x="516" y="134" width="82" height="30" rx="3" fill="rgb(177,168,218)"/><text x="557.0" y="154" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4.88</text><text x="162" y="189" font-size="11" fill="#2C2C2A" text-anchor="end" font-weight="400">model of decoded 26-28</text><rect x="172" y="168" width="82" height="30" rx="3" fill="rgb(155,146,210)"/><text x="213.0" y="188" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.38</text><rect x="258" y="168" width="82" height="30" rx="3" fill="rgb(110,101,193)"/><text x="299.0" y="188" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.38</text><rect x="344" y="168" width="82" height="30" rx="3" fill="rgb(104,95,191)"/><text x="385.0" y="188" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.24</text><rect x="430" y="168" width="82" height="30" rx="3" fill="rgb(127,118,199)"/><text x="471.0" y="188" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.76</text><rect x="516" y="168" width="82" height="30" rx="3" fill="rgb(195,186,225)"/><text x="557.0" y="188" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">5.30</text><text x="162" y="223" font-size="11" fill="#2C2C2A" text-anchor="end" font-weight="400">model of diamonds</text><rect x="172" y="202" width="82" height="30" rx="3" fill="rgb(145,136,206)"/><text x="213.0" y="222" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.17</text><rect x="258" y="202" width="82" height="30" rx="3" fill="rgb(106,97,191)"/><text x="299.0" y="222" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.28</text><rect x="344" y="202" width="82" height="30" rx="3" fill="rgb(113,104,194)"/><text x="385.0" y="222" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.44</text><rect x="430" y="202" width="82" height="30" rx="3" fill="rgb(100,91,189)"/><text x="471.0" y="222" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.16</text><rect x="516" y="202" width="82" height="30" rx="3" fill="rgb(137,128,203)"/><text x="557.0" y="222" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.98</text><text x="162" y="257" font-size="11" fill="#2C2C2A" text-anchor="end" font-weight="400">model of end</text><rect x="172" y="236" width="82" height="30" rx="3" fill="rgb(176,167,218)"/><text x="213.0" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4.86</text><rect x="258" y="236" width="82" height="30" rx="3" fill="rgb(155,146,210)"/><text x="299.0" y="256" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.40</text><rect x="344" y="236" width="82" height="30" rx="3" fill="rgb(160,151,212)"/><text x="385.0" y="256" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.51</text><rect x="430" y="236" width="82" height="30" rx="3" fill="rgb(138,129,203)"/><text x="471.0" y="256" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">4.00</text><rect x="516" y="236" width="82" height="30" rx="3" fill="rgb(123,114,198)"/><text x="557.0" y="256" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400">3.67</text><text x="24" y="292" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Bits per letter when the model of one realm (row) reads another (column); darker = closer speech.</text><text x="24" y="308" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Each realm reads its neighbours best: opening → heartland → 26–28 → diamonds → end is a chain, and the</text><text x="24" y="324" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">end is closest to the diamonds and farthest from the opening — the language drifts along the book.</text></svg>