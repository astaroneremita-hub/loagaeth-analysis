<svg xmlns="http://www.w3.org/2000/svg" width="824" height="300" viewBox="0 0 824 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>The book is a chant: metre and stress</title><rect x="0" y="0" width="824" height="300" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">The book is a chant: metre and stress</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Row-written tables; stress from the accented leaves 2a–5a.</text><rect x="24" y="224.7058823529412" width="30" height="15.294117647058824" rx="2" fill="#7F77DD"/><text x="39.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">1</text><text x="39.0" y="219.7058823529412" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">26</text><rect x="62" y="182.35294117647058" width="30" height="57.64705882352941" rx="2" fill="#7F77DD"/><text x="77.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">2</text><text x="77.0" y="177.35294117647058" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">98</text><rect x="100" y="90.0" width="30" height="150.0" rx="2" fill="#D85A30"/><text x="115.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">3</text><text x="115.0" y="85.0" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">255</text><rect x="138" y="162.94117647058823" width="30" height="77.05882352941177" rx="2" fill="#D85A30"/><text x="153.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">4</text><text x="153.0" y="157.94117647058823" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">131</text><rect x="176" y="207.05882352941177" width="30" height="32.94117647058823" rx="2" fill="#7F77DD"/><text x="191.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">5</text><text x="191.0" y="202.05882352941177" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">56</text><rect x="214" y="211.1764705882353" width="30" height="28.823529411764707" rx="2" fill="#7F77DD"/><text x="229.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">6</text><text x="229.0" y="206.1764705882353" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">49</text><rect x="252" y="230.0" width="30" height="10.0" rx="2" fill="#7F77DD"/><text x="267.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">7</text><text x="267.0" y="225.0" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">17</text><rect x="290" y="232.94117647058823" width="30" height="7.0588235294117645" rx="2" fill="#7F77DD"/><text x="305.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">8</text><text x="305.0" y="227.94117647058823" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">12</text><rect x="328" y="233.52941176470588" width="30" height="6.470588235294118" rx="2" fill="#7F77DD"/><text x="343.0" y="256" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">9</text><text x="343.0" y="228.52941176470588" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">11</text><text x="24" y="76" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Syllables between one stress and the next (the foot)</text><text x="195.0" y="274" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">stress falls every 3–4 syllables</text><text x="406" y="76" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Syllables per 49-letter line, by region</text><rect x="406" y="90" width="52.739999999999995" height="18" rx="2" fill="#1D9E75"/><text x="466.74" y="104" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">I  17.6</text><rect x="406" y="120" width="53.13" height="18" rx="2" fill="#1D9E75"/><text x="467.13" y="134" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">II  17.7</text><rect x="406" y="150" width="53.67" height="18" rx="2" fill="#1D9E75"/><text x="467.67" y="164" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">III  17.9</text><rect x="406" y="180" width="51.510000000000005" height="18" rx="2" fill="#1D9E75"/><text x="465.51" y="194" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">IV  17.2</text><rect x="406" y="210" width="48.0" height="18" rx="2" fill="#1D9E75"/><text x="462.0" y="224" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">V  16.0</text><text x="406" y="250" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">~17–18 on every line (real spread 1.05 vs 1.70 shuffled, z −24):</text><text x="406" y="266" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">the lines are tuned to a beat — the book is meant to be intoned.</text></svg>