<svg xmlns="http://www.w3.org/2000/svg" width="727" height="512" viewBox="0 0 727 512" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Can the Calls lend their meanings?</title><rect x="0" y="0" width="727" height="512" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Can the Calls lend their meanings?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Bars: occurrences in the whole book; thin grey bars: what a 3-letter model of the book expects.</text><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Words of the Calls (with Dee's English) inside the Loagaeth: found vs expected from letter habits</text><text x="24" y="103" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">TAGE — “as is not”</text><rect x="250" y="91" width="311.616847826087" height="9" rx="2" fill="#534AB7"/><rect x="250" y="101" width="330.0" height="6" rx="2" fill="#B4B2A9"/><text x="586.0" y="103" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">139 vs 147.2 (z -0.7)</text><text x="24" y="127" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">EMNA — “here”</text><rect x="250" y="115" width="210.7336956521739" height="9" rx="2" fill="#534AB7"/><rect x="250" y="125" width="223.2880434782609" height="6" rx="2" fill="#B4B2A9"/><text x="479.2880434782609" y="127" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">94 vs 99.6 (z -0.6)</text><text x="24" y="151" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">HARG — “hath planted”</text><rect x="250" y="139" width="105.36684782608695" height="9" rx="2" fill="#534AB7"/><rect x="250" y="149" width="117.92119565217394" height="6" rx="2" fill="#B4B2A9"/><text x="373.92119565217394" y="151" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">47 vs 52.6 (z -0.8)</text><text x="24" y="175" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">TALO — “as the first”</text><rect x="250" y="163" width="60.52989130434783" height="9" rx="2" fill="#534AB7"/><rect x="250" y="173" width="65.23777173913045" height="6" rx="2" fill="#B4B2A9"/><text x="321.23777173913044" y="175" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">27 vs 29.1 (z -0.4)</text><text x="24" y="199" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">DARG — “6739”</text><rect x="250" y="187" width="51.5625" height="9" rx="2" fill="#534AB7"/><rect x="250" y="197" width="56.71875000000001" height="6" rx="2" fill="#B4B2A9"/><text x="312.71875" y="199" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">23 vs 25.3 (z -0.5)</text><text x="24" y="223" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">CALZ — “above the firmaments”</text><rect x="250" y="211" width="26.90217391304348" height="9" rx="2" fill="#534AB7"/><rect x="250" y="221" width="30.040760869565222" height="6" rx="2" fill="#B4B2A9"/><text x="286.04076086956525" y="223" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">12 vs 13.4 (z -0.4)</text><text x="24" y="247" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ALDON — “Gyrd up; gather up”</text><rect x="250" y="235" width="22.41847826086957" height="9" rx="2" fill="#534AB7"/><rect x="250" y="245" width="41.69836956521739" height="6" rx="2" fill="#B4B2A9"/><text x="297.6983695652174" y="247" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">10 vs 18.6 (z -2.0)</text><text x="24" y="271" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">NOCO — “the servant”</text><rect x="250" y="259" width="20.176630434782613" height="9" rx="2" fill="#534AB7"/><rect x="250" y="269" width="21.52173913043478" height="6" rx="2" fill="#B4B2A9"/><text x="277.52173913043475" y="271" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">9 vs 9.6 (z -0.2)</text><text x="24" y="295" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">AMMA — “Cursed”</text><rect x="250" y="283" width="20.176630434782613" height="9" rx="2" fill="#534AB7"/><rect x="250" y="293" width="21.29755434782609" height="6" rx="2" fill="#B4B2A9"/><text x="277.29755434782606" y="295" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">9 vs 9.5 (z -0.2)</text><text x="24" y="319" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ALAR — “have setled”</text><rect x="250" y="307" width="15.692934782608697" height="9" rx="2" fill="#534AB7"/><rect x="250" y="317" width="17.03804347826087" height="6" rx="2" fill="#B4B2A9"/><text x="273.0380434782609" y="319" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">7 vs 7.6 (z -0.2)</text><text x="24" y="343" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ALDI — “of gathering,”</text><rect x="250" y="331" width="13.45108695652174" height="9" rx="2" fill="#534AB7"/><rect x="250" y="341" width="14.796195652173912" height="6" rx="2" fill="#B4B2A9"/><text x="270.79619565217394" y="343" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">6 vs 6.6 (z -0.2)</text><text x="24" y="367" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">CORS — “such”</text><rect x="250" y="355" width="13.45108695652174" height="9" rx="2" fill="#534AB7"/><rect x="250" y="365" width="14.572010869565219" height="6" rx="2" fill="#B4B2A9"/><text x="270.57201086956525" y="367" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">6 vs 6.5 (z -0.2)</text><text x="24" y="391" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ZIROP — “was,”</text><rect x="250" y="379" width="13.45108695652174" height="9" rx="2" fill="#534AB7"/><rect x="250" y="389" width="3.586956521739131" height="6" rx="2" fill="#B4B2A9"/><text x="269.45108695652175" y="391" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">6 vs 1.6 (z 3.5)</text><text x="24" y="415" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">OMAX — “knowest”</text><rect x="250" y="403" width="13.45108695652174" height="9" rx="2" fill="#534AB7"/><rect x="250" y="413" width="15.020380434782611" height="6" rx="2" fill="#B4B2A9"/><text x="271.0203804347826" y="415" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">6 vs 6.7 (z -0.3)</text><rect x="24" y="428" width="12" height="12" rx="2" fill="#534AB7"/><text x="42" y="438" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">found</text><rect x="85" y="428" width="12" height="12" rx="2" fill="#B4B2A9"/><text x="103" y="438" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Markov-3 expectation</text><text x="24" y="462" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Every glossed Call word occurs about as often as the Loagaeth's own letter habits predict — none is a</text><text x="24" y="478" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">shared word that could carry its meaning across. Leaf titles are not in their leaf's dialect either</text><text x="24" y="494" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">(mean rank 0.493 of the own side vs 0.5 by chance, 33 titles).</text></svg>