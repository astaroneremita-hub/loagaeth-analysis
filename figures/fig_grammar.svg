<svg xmlns="http://www.w3.org/2000/svg" width="769" height="400" viewBox="0 0 769 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>What is the shortest 'program' of the text?</title><rect x="0" y="0" width="769" height="400" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">What is the shortest 'program' of the text?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Bars start at 2.5 bits.</text><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Bits per letter on the odd tables, models trained on the even tables (lower = better code)</text><text x="24" y="104" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">letters, 3-letter memory</text><rect x="240" y="92" width="134.81999999999994" height="16" rx="3" fill="#534AB7"/><text x="380.81999999999994" y="105" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">2.949</text><text x="24" y="130" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">letters, 4-letter memory</text><rect x="240" y="118" width="184.41" height="16" rx="3" fill="#7F77DD"/><text x="430.40999999999997" y="131" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">3.115</text><text x="24" y="156" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">names + letters (grammar)</text><rect x="240" y="144" width="139.14" height="16" rx="3" fill="#1D9E75"/><text x="385.14" y="157" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">2.964</text><text x="24" y="182" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">grammar + cost of its lexicon</text><rect x="240" y="170" width="147.69000000000005" height="16" rx="3" fill="#639922"/><text x="393.69000000000005" y="183" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">2.992</text><text x="24" y="218" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">One grammar for the book vs one per part (a27), on each part's test tables</text><text x="24" y="243" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">part I</text><rect x="240" y="231" width="202.80000000000004" height="9" rx="2" fill="#B4B2A9"/><rect x="240" y="241" width="199.5" height="9" rx="2" fill="#BA7517"/><text x="448.80000000000007" y="244" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">book 3.176 · own part 3.165</text><text x="24" y="267" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">part II</text><rect x="240" y="255" width="48.89999999999994" height="9" rx="2" fill="#B4B2A9"/><rect x="240" y="265" width="72.00000000000006" height="9" rx="2" fill="#BA7517"/><text x="318.00000000000006" y="268" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">book 2.663 · own part 2.74</text><text x="24" y="291" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">part III</text><rect x="240" y="279" width="74.09999999999997" height="9" rx="2" fill="#B4B2A9"/><rect x="240" y="289" width="105.59999999999997" height="9" rx="2" fill="#BA7517"/><text x="351.59999999999997" y="292" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">book 2.747 · own part 2.852</text><text x="24" y="315" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">part IV</text><rect x="240" y="303" width="174.00000000000003" height="9" rx="2" fill="#B4B2A9"/><rect x="240" y="313" width="221.10000000000002" height="9" rx="2" fill="#BA7517"/><text x="467.1" y="316" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">book 3.08 · own part 3.237</text><text x="24" y="339" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">part V</text><rect x="240" y="327" width="354.00000000000006" height="9" rx="2" fill="#B4B2A9"/><rect x="240" y="337" width="315.9" height="9" rx="2" fill="#BA7517"/><text x="600.0" y="340" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">book 3.68 · own part 3.553</text><text x="24" y="366" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Names make up 1.7% of tokens and do not shorten the code: a 3-letter memory already</text><text x="24" y="382" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">captures them. Only the last part (41–48, the U register) is better coded by its own grammar.</text></svg>