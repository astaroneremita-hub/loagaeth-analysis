<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Are we looking wrong? The findings under other readings</title><rect x="0" y="0" width="720" height="342" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Are we looking wrong? The findings under other readings</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Each core result recomputed on altered transcriptions.</text><text x="220" y="82" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">doubled (obs/exp)</text><text x="316" y="82" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">row edges z</text><text x="412" y="82" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">segments χ² / null</text><text x="508" y="82" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">territory z</text><text x="604" y="82" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">CHASTOR</text><text x="24" y="112" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">as transcribed</text><rect x="176" y="98" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="220" y="113" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">0.07</text><rect x="272" y="98" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="316" y="113" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">43</text><rect x="368" y="98" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="412" y="113" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">11104 / 4306</text><rect x="464" y="98" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="508" y="113" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">2.0</text><rect x="560" y="98" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="604" y="113" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">195</text><text x="24" y="142" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Z = X</text><rect x="176" y="128" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="220" y="143" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">0.08</text><rect x="272" y="128" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="316" y="143" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">39</text><rect x="368" y="128" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="412" y="143" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">11027 / 4257</text><rect x="464" y="128" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="508" y="143" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">2.0</text><rect x="560" y="128" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="604" y="143" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">195</text><text x="24" y="172" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">U = V</text><rect x="176" y="158" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="220" y="173" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">0.09</text><rect x="272" y="158" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="316" y="173" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">43</text><rect x="368" y="158" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="412" y="173" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">8288 / 3183</text><rect x="464" y="158" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="508" y="173" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">2.0</text><rect x="560" y="158" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="604" y="173" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">195</text><text x="24" y="202" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">U read as A</text><rect x="176" y="188" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="220" y="203" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">0.21</text><rect x="272" y="188" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="316" y="203" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">41</text><rect x="368" y="188" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="412" y="203" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4557 / 1939</text><rect x="464" y="188" width="88" height="22" rx="3" fill="#FAECE7"/><text x="508" y="203" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">1.1</text><rect x="560" y="188" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="604" y="203" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">214</text><text x="24" y="232" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">only exact 49×49 sides</text><rect x="176" y="218" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="220" y="233" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">0.07</text><rect x="272" y="218" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="316" y="233" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">47</text><rect x="368" y="218" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="412" y="233" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">9444 / 2876</text><rect x="464" y="218" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="508" y="233" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">2.0</text><rect x="560" y="218" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="604" y="233" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">169</text><text x="24" y="262" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">2% look-alike noise ×10</text><rect x="176" y="248" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="220" y="263" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">0.07–0.07</text><rect x="272" y="248" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="316" y="263" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">40–43</text><rect x="368" y="248" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="412" y="263" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">10370–10540</text><rect x="464" y="248" width="88" height="22" rx="3" fill="#FAECE7"/><text x="508" y="263" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">1.5–2.2</text><rect x="560" y="248" width="88" height="22" rx="3" fill="#E1F5EE"/><text x="604" y="263" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">183–192</text><text x="24" y="292" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Green = the finding holds under that reading; red = it weakens below the usual threshold.</text><text x="24" y="308" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">The grammar (no doubled letters, row edges) and the segment differences hold everywhere. The CHASTOR</text><text x="24" y="324" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">territory is moderate (density z ≈ 2) and fades if U is read as A: part of it is the U register at the end.</text></svg>