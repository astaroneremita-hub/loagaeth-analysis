<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loagaeth 3D Tables</title>
<style>
  :root {
    --bg0: #07080c; --bg1: #121624; --ink: #e9dfc6; --mute: #9aa0b4; --line: #2a3046;
    --panel: rgba(14, 17, 28, 0.86); --accent: #e8b84a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 60% 35%, var(--bg1) 0%, var(--bg0) 70%);
    color: var(--ink); font: 13px/1.45 Georgia, "Times New Roman", serif;
  }
  #stage { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 14px; left: 14px; width: 272px; max-height: calc(100% - 28px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px;
    backdrop-filter: blur(6px); z-index: 2;
  }
  #panel h1 { font-size: 17px; font-weight: normal; margin: 0 0 10px; letter-spacing: .04em; }
  #panel h1 span { color: var(--accent); font-size: 12px; margin-left: 4px; letter-spacing: .2em; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 12px; }
  .seg button {
    background: #1a1f30; color: var(--mute); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 0; font: inherit; font-size: 12px; cursor: pointer;
  }
  .seg button.on { background: #2b2414; color: var(--accent); border-color: #6b5320; }
  section { border-top: 1px solid var(--line); padding: 9px 0 4px; }
  section[hidden], .row[hidden] { display: none; }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row > span { width: 92px; color: var(--mute); font-size: 12px; flex: none; }
  select, input[type=range] { flex: 1; min-width: 0; }
  select {
    background: #1a1f30; color: var(--ink); border: 1px solid var(--line); border-radius: 5px;
    padding: 3px 4px; font: inherit; font-size: 12px;
  }
  input[type=range] { accent-color: var(--accent); }
  label.chk { display: flex; gap: 7px; align-items: center; margin: 5px 0; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); }
  small { color: var(--mute); display: block; font-size: 11px; }
  #legend { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
  #legend .it { display: flex; align-items: center; gap: 7px; font-size: 11.5px; margin: 2px 0; color: #cfc8b4; }
  #legend i { width: 12px; height: 12px; border-radius: 2px; flex: none; display: inline-block; }
  #legend .h { color: var(--mute); font-size: 11px; margin: 6px 0 2px; letter-spacing: .06em; text-transform: uppercase; }
  #hover { min-height: 18px; margin-top: 8px; color: var(--accent); font-size: 12px; font-family: Consolas, monospace; }
  #caption {
    position: fixed; left: 300px; right: 16px; bottom: 14px; text-align: center; color: #d9d1bb;
    font-size: 13px; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 1;
  }
  #toggle { display: none; }
  @media (max-width: 720px) {
    #panel { left: 8px; right: 8px; top: 8px; width: auto; max-height: 55%; }
    #panel.closed > *:not(#toggle):not(h1) { display: none; }
    #toggle {
      display: block; position: absolute; right: 10px; top: 10px; background: #1a1f30; color: var(--ink);
      border: 1px solid var(--line); border-radius: 5px; font: inherit; font-size: 12px; padding: 2px 8px;
    }
    #caption { left: 16px; font-size: 12px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script src="loagaeth_viz_data.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <button id="toggle">menu</button>
  <h1>Liber Loagaeth<span>3D</span></h1>
  <div class="seg" id="views">
    <button data-view="square">Square</button>
    <button data-view="diamond">Diamond</button>
    <button data-view="pyramid">Pyramid</button>
    <button data-view="book">Book</button>
    <button data-view="heat">Heatmap</button>
    <button data-view="trail">Trail</button>
    <button data-view="closed">Closed pyr.</button>
    <button data-view="tess">Tesseract</button>
    <button data-view="ico">Icosahedron</button>
  </div>

  <section data-show="square diamond">
    <div class="row"><span>Table</span><select id="tbl"></select></div>
    <div class="row"><span>Side</span><select id="side"><option value="a">a</option><option value="b">b</option></select></div>
  </section>

  <section data-show="square">
    <label class="chk"><input type="checkbox" id="currents"> Show the two currents</label>
    <small id="curNote">Available for the diagonal squares 25b-28b.</small>
  </section>

  <section data-show="diamond">
    <div class="row"><span>Layout</span><select id="dlayout">
      <option value="side">One side: stepped rhombus</option>
      <option value="combined">Both sides: 49x49 grid</option>
    </select></div>
    <div class="row" id="gapRow"><span>Halves gap</span><input type="range" id="gap" min="0" max="8" step="0.1" value="2"></div>
    <div class="row" id="rotRow"><span>Rotation</span><input type="range" id="rot" min="0" max="45" step="1" value="45"></div>
    <small id="dNote"></small>
  </section>

  <section data-show="pyramid">
    <div class="row"><span>Base square</span><select id="pBase"></select></div>
    <div class="row"><span>Faces from</span><select id="pFace"></select></div>
    <label class="chk"><input type="checkbox" id="octa"> Octahedron (two pyramids)</label>
    <div class="row" id="pFace2Row"><span>Lower faces</span><select id="pFace2"></select></div>
    <div class="row"><span id="foldLbl">Unfold faces</span><input type="range" id="fold" min="0" max="1" step="0.01" value="0"></div>
    <label class="chk"><input type="checkbox" id="showBase" checked> Show base square</label>
  </section>

  <section data-show="heat">
    <div class="row"><span>Measure</span><select id="hMode">
      <option value="names">Master-name cells</option><option value="letter">Letter obs/exp</option></select></div>
    <div class="row" id="hNameRow"><span>Name</span><select id="hName"></select></div>
    <div class="row" id="hLetterRow"><span>Letter</span><select id="hLetter"></select></div>
    <label class="chk"><input type="checkbox" id="hNull"> Null: letters shuffled in each side</label>
    <small id="hNote"></small>
  </section>

  <section data-show="trail">
    <div class="row"><span>Source</span><select id="trSrc"></select></div>
    <div class="row"><span>Letter order</span><select id="trOrder">
      <option value="given">A O N H L D R C X E G T</option><option value="freq">frequency in stack</option></select></div>
    <label class="chk"><input type="checkbox" id="trObs" checked> Observed trail (gold)</label>
    <label class="chk"><input type="checkbox" id="trNull"> Null trail (cyan, shuffled)</label>
    <small id="trList"></small>
  </section>

  <section data-show="closed">
    <div class="row"><span>Points</span><select id="clName"></select></div>
    <div class="row"><span>Glow</span><input type="range" id="clGlow" min="0.4" max="3" step="0.05" value="2"></div>
    <label class="chk"><input type="checkbox" id="clBase" checked> Base: stacked name heat</label>
  </section>

  <section data-show="tess">
    <div class="row"><span>First side</span><select id="tsStart"></select></div>
    <div class="row"><span>4D angle</span><input type="range" id="tsAngle" min="0" max="360" step="1" value="30"></div>
    <label class="chk"><input type="checkbox" id="tsSpin" checked> Spin in 4D</label>
  </section>

  <section data-show="ico">
    <div class="row"><span>Sides of 29-38</span><select id="icSide"><option value="a">a</option><option value="b">b</option></select></div>
    <div class="row"><span>Octahedron</span><select id="icOcta"><option value="">-</option><option value="go">open the octahedron view</option></select></div>
  </section>

  <section data-show="square diamond pyramid tess ico">
    <label class="chk"><input type="checkbox" id="hiNames" checked> Highlight master names</label>
  </section>

  <div id="legend"></div>
  <div id="hover"></div>
</div>
<div id="caption"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = window.LOAGAETH;
const $ = (id) => document.getElementById(id);
const caption = $('caption');
if (!D) { caption.textContent = 'Data file loagaeth_viz_data.js not found - run python src/make_viz_data.py'; throw new Error('no data'); }

// ---------------------------------------------------------------- palette
const NAME_COLORS = [0xe8b84a, 0xff7a66, 0x3cc7b4, 0xa78bfa, 0xa78bfa, 0x3cc7b4, 0x7bd36b, 0x5b9cff];
const NAME_LEGEND = [['CHASTOR', 0xe8b84a], ['ANZACH', 0xff7a66], ['GETH / ALGETH', 0x3cc7b4],
  ['NOCHA / ADNOCHA', 0xa78bfa], ['ACLAX', 0x7bd36b], ['CHUSTOR', 0x5b9cff]];
const C = {
  tileA: 0x1b2131, tileB: 0x262e44, ink: 0xe9dfc6, inkDark: 0x10131a,
  warm: 0x3b2c1c, cool: 0x1b2d3d, join: 0x4d3f1c, curA: 0xf2c66d, curB: 0x6fd3ff,
  curTileA: 0x33291a, curTileB: 0x182c38,
};
const ZONE_COLORS = { prophecy: 0xb48cf0, frontier: 0x7fa7c9, CHASTOR: 0xe8b84a, CHUSTOR: 0x5b9cff, border: 0xc97a5a, void: 0x50566a };
const FORMAT_COLORS = { 'square-rows': 0xe9dfc6, 'square-diagonal': 0x3cc7b4, diamond: 0xff7a66, prose: 0xb48cf0 };
const rgb = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
const css = (h) => '#' + h.toString(16).padStart(6, '0');

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 2000);
camera.position.set(0, 0, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = true;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- glyph atlas (one texture)
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const GI = {}; [...CHARS].forEach((ch, i) => GI[ch] = i);
const atlas = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 88px Georgia, "Times New Roman", serif';
  [...CHARS].forEach((ch, i) => g.fillText(ch, (i % 8) * 128 + 64, Math.floor(i / 8) * 128 + 70));
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  return t;
})();

const cellMaterial = new THREE.ShaderMaterial({
  uniforms: { uAtlas: { value: atlas }, uInset: { value: 0.05 }, uGlyph: { value: 0.84 } },
  side: THREE.DoubleSide,
  vertexShader: `
    attribute float aGlyph; attribute vec4 aBg; attribute vec3 aFg;
    varying vec2 vUv; varying float vGlyph; varying vec4 vBg; varying vec3 vFg;
    void main() {
      vUv = uv; vGlyph = aGlyph; vBg = aBg; vFg = aFg;
      gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D uAtlas; uniform float uInset; uniform float uGlyph;
    varying vec2 vUv; varying float vGlyph; varying vec4 vBg; varying vec3 vFg;
    void main() {
      vec2 uv = vUv;
      if (!gl_FrontFacing) uv.x = 1.0 - uv.x;   // keep letters unmirrored from behind
      float inside = step(uInset, uv.x) * step(uv.x, 1.0 - uInset) * step(uInset, uv.y) * step(uv.y, 1.0 - uInset);
      float a = 0.0;
      if (vGlyph >= 0.0) {
        vec2 g = clamp((uv - 0.5) / uGlyph + 0.5, 0.0, 1.0);
        float row = floor((vGlyph + 0.5) / 8.0), col = floor(vGlyph - row * 8.0 + 0.5);
        a = texture2D(uAtlas, vec2((col + g.x) / 8.0, 1.0 - (row + 1.0 - g.y) / 8.0)).a;
      }
      float bgA = vBg.a * inside;
      float alpha = max(bgA, a);
      if (alpha < 0.35) discard;
      vec3 base = bgA > 0.0 ? vBg.rgb : vFg;
      gl_FragColor = vec4(mix(base, vFg, a), 1.0);
    }`,
});

// One InstancedMesh carries tiles + glyphs for a whole view.
class CellLayer {
  constructor(n) {
    this.n = n;
    this.geo = new THREE.PlaneGeometry(1, 1);
    this.glyph = new Float32Array(n); this.bg = new Float32Array(n * 4); this.fg = new Float32Array(n * 3);
    this.geo.setAttribute('aGlyph', new THREE.InstancedBufferAttribute(this.glyph, 1));
    this.geo.setAttribute('aBg', new THREE.InstancedBufferAttribute(this.bg, 4));
    this.geo.setAttribute('aFg', new THREE.InstancedBufferAttribute(this.fg, 3));
    this.mesh = new THREE.InstancedMesh(this.geo, cellMaterial, n);
    this.mesh.frustumCulled = false;
    this.info = new Array(n);
    this.i = 0;
  }
  add(matrix, ch, bgHex, fgHex, bgAlpha = 1, info = null) {
    const i = this.i++;
    this.mesh.setMatrixAt(i, matrix);
    this.glyph[i] = ch in GI ? GI[ch] : -1;
    const b = rgb(bgHex), f = rgb(fgHex);
    this.bg.set([b[0], b[1], b[2], bgAlpha], i * 4); this.fg.set(f, i * 3);
    this.info[i] = info;
    return i;
  }
  done() { this.mesh.count = this.i; this.mesh.instanceMatrix.needsUpdate = true; this.mesh.computeBoundingSphere(); }
}

// ---------------------------------------------------------------- data helpers
const T = D.tables, NAMES = D.names;
const zoneOf = (n) => D.zones[n] || 'void';
const keyOf = (t, s) => `${t}${s}`;
function nameMap(entry) {           // (row*100+col) -> name index; longer names drawn last win
  const m = new Map();
  if (!$('hiNames').checked || !entry) return m;
  const occ = entry.occ.slice().sort((a, b) => a[3] - b[3]);
  for (const [k, r0, c0, len, dr, dc] of occ) for (let i = 0; i < len; i++) m.set((r0 + dr * i) * 100 + (c0 + dc * i), k);
  return m;
}
const totalCells = (e) => e.rows.reduce((s, r) => s + r.length, 0);
const occCount = (e) => { const c = {}; e.occ.forEach(o => c[NAMES[o[0]]] = (c[NAMES[o[0]]] || 0) + 1); return c; };
const occSummary = (e) => { const c = occCount(e); const s = Object.entries(c).map(([k, v]) => `${k} ${v}`).join(', '); return s || 'no master names'; };
function triangles(entry) {          // upper triangle (apex first) and lower triangle (apex first)
  const lens = entry.rows.map(r => r.length), mx = Math.max(...lens);
  const first = lens.indexOf(mx), last = lens.lastIndexOf(mx);
  const up = [], lo = [];
  for (let u = 0; u <= first; u++) up.push(u);
  for (let u = entry.rows.length - 1; u >= last; u--) lo.push(u);
  return { up, lo, first, last };
}

// ---------------------------------------------------------------- view plumbing
let root = new THREE.Group(); scene.add(root);
let tickers = [], pickables = [], hoverLayer = null, onSlider = null;
function clearView() {
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material !== cellMaterial) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (m.map && m.map !== atlas && m.map !== dotTex) m.map.dispose();
      m.dispose();
    });
  });
  scene.remove(root); root = new THREE.Group(); scene.add(root);
  tickers = []; pickables = []; hoverLayer = null; onSlider = null; heatPick = null;
  $('hover').textContent = '';
}
let fly = null;
function flyTo(pos, target) {
  fly = { t: 0, p0: camera.position.clone(), p1: new THREE.Vector3(...pos), q0: controls.target.clone(), q1: new THREE.Vector3(...target) };
}

const state = { view: 'square', table: 12, side: 'a' };
const M4 = new THREE.Matrix4();

// ---------------------------------------------------------------- SQUARE
function buildSquare() {
  const key = keyOf(state.table, state.side), e = T[key];
  const diag = e.f === 'square-diagonal', cur = diag && $('currents').checked;
  const hm = nameMap(e);
  const layer = new CellLayer(totalCells(e));
  e.rows.forEach((row, r) => [...row].forEach((ch, c) => {
    const k = hm.get(r * 100 + c);
    const par = (r + c) % 2;
    let bg = par ? C.tileB : C.tileA;
    if (cur) bg = par === e.drp ? C.curTileA : C.curTileB;
    const hi = k !== undefined;
    M4.makeTranslation(c - 24, 24 - r, hi ? 0.35 : 0);
    layer.add(M4, ch, hi ? NAME_COLORS[k] : bg, hi ? C.inkDark : C.ink, 1, { r, c, ch, k });
  }));
  layer.done(); root.add(layer.mesh); hoverLayer = layer;
  if (cur) buildCurrents(e);
  const fmt = diag
    ? `${e.rows.length}x49 square whose text runs along r-c diagonals: (r+c) ${e.drp ? 'odd' : 'even'} cells read down-right, the other colour up-left`
    : `49x49 square read in rows (${totalCells(e).toLocaleString('en')} letters)`;
  caption.textContent = `Table ${key} - ${fmt}. Highlights: ${occSummary(e)}.`;
  legend(diag ? [['Down-right current', cur ? C.curA : null], ['Up-left current', cur ? C.curB : null]].filter(x => x[1]) : []);
}

const lineVS = `attribute float aS; varying float vS; void main(){ vS = aS; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const lineFS = `uniform float uTime; uniform vec3 uColor; varying float vS;
  void main(){ float q = fract((uTime * 5.0 - vS) / 9.0); float a = 0.12 + 0.88 * pow(1.0 - q, 5.0); gl_FragColor = vec4(uColor * a, 1.0); }`;
function buildCurrents(e) {
  const groups = [[], []]; // 0: down-right, 1: up-left
  for (let d = -48; d <= 48; d++) {
    const cells = [];
    for (let r = 0; r < 49; r++) { const c = r - d; if (c >= 0 && c < 49 && r < e.rows.length && c < e.rows[r].length) cells.push([r, c]); }
    if (cells.length < 2) continue;
    const dr = Math.abs(d) % 2 === e.drp;
    if (!dr) cells.reverse();
    groups[dr ? 0 : 1].push(cells);
  }
  const cone = new THREE.ConeGeometry(0.32, 0.9, 10);
  groups.forEach((list, gi) => {
    const pos = [], s = [];
    const col = gi === 0 ? C.curA : C.curB;
    const heads = new THREE.InstancedMesh(cone, new THREE.MeshBasicMaterial({ color: col }), list.length);
    const up = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion();
    list.forEach((cells, li) => {
      const [r0, c0] = cells[0], [r1, c1] = cells[cells.length - 1];
      const L = (cells.length - 1) * Math.SQRT2;
      pos.push(c0 - 24, 24 - r0, 0.6, c1 - 24, 24 - r1, 0.6); s.push(0, L);
      const dir = new THREE.Vector3(c1 - c0, -(r1 - r0), 0).normalize();
      q.setFromUnitVectors(up, dir);
      M4.compose(new THREE.Vector3(c1 - 24, 24 - r1, 0.6).addScaledVector(dir, 0.5), q, new THREE.Vector3(1, 1, 1));
      heads.setMatrixAt(li, M4);
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aS', new THREE.Float32BufferAttribute(s, 1));
    const mat = new THREE.ShaderMaterial({ uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(...rgb(col)) } },
      vertexShader: lineVS, fragmentShader: lineFS, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    root.add(new THREE.LineSegments(g, mat)); root.add(heads);
    tickers.push((t) => mat.uniforms.uTime.value = t);
  });
}

// ---------------------------------------------------------------- DIAMOND
function isPattern(e, odd) {
  const n = odd ? 49 : 48;
  if (e.rows.length !== n) return false;
  return e.rows.every((r, u) => r.length === (odd ? (u <= 24 ? 2 * u + 1 : 97 - 2 * u) : (u <= 23 ? 2 * u + 2 : 96 - 2 * u)));
}
function buildDiamond() {
  const layout = $('dlayout').value;
  $('gapRow').hidden = layout !== 'side'; $('rotRow').hidden = layout !== 'combined';
  $('dNote').textContent = '';
  if (layout === 'combined') { if (buildCombined()) return; $('dNote').textContent = 'Both sides have the same row parity (or an irregular row count): showing one side.'; }
  $('gapRow').hidden = false; $('rotRow').hidden = true;
  const key = keyOf(state.table, state.side), e = T[key];
  const hm = nameMap(e), tri = triangles(e), gap = +$('gap').value;
  const n = e.rows.length, mid = (tri.first + tri.last) / 2;
  const layer = new CellLayer(totalCells(e));
  const outline = [[], []];
  e.rows.forEach((row, u) => {
    const half = u < tri.first ? 0 : u > tri.last ? 1 : -1;
    const y = mid - u + (half === 0 ? gap : half === 1 ? -gap : 0);
    const len = row.length;
    [...row].forEach((ch, j) => {
      const k = hm.get(u * 100 + j);
      const bg = k !== undefined ? NAME_COLORS[k] : half === 0 ? C.warm : half === 1 ? C.cool : C.join;
      M4.makeTranslation(j - (len - 1) / 2, y, k !== undefined ? 0.35 : 0);
      layer.add(M4, ch, bg, k !== undefined ? C.inkDark : C.ink, 1, { r: u, c: j, ch, k, side: key });
    });
    if (half !== 1) outline[0].push([len / 2, y]);
    if (half !== 0) outline[1].push([len / 2, y]);
  });
  layer.done(); root.add(layer.mesh); hoverLayer = layer;
  // stepped silhouettes of the two halves (each a stepped pyramid sharing the widest row)
  outline.forEach((rows, hi) => {
    const right = [];
    rows.forEach(([hw, y]) => { right.push([hw + 0.1, y + 0.6], [hw + 0.1, y - 0.6]); });
    const left = right.map(([x, y]) => [-x, y]).reverse();

function buildClosed() {

    const base = new CellLayer(2401);

  root.add(new THREE.Mesh(fg, new THREE.MeshStandardMaterial({ color: 0xc9a85a, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false })));
  const ep = []; for (let i = 0; i < 4; i++) ep.push(cs[i], cs[(i + 1) % 4], cs[i], apex);

// ---------------------------------------------------------------- TESSERACT
function buildTess() {
  const keys = Object.keys(T).filter(k => T[k].f === 'square-rows').sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b));
  const start = keys.indexOf($('tsStart').value), sides = Array.from({ length: 24 }, (_, i) => keys[(start + i) % keys.length]);
  const TS = 392, cv = document.createElement('canvas'); cv.width = TS * 6; cv.height = TS * 4;
  const g = cv.getContext('2d'); g.font = 'bold 7px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  sides.forEach((k, f) => {
    const e = T[k], hm = nameMap(e), ox = (f % 6) * TS, oy = Math.floor(f / 6) * TS;
    g.fillStyle = '#141a28'; g.fillRect(ox, oy, TS, TS);
    e.rows.forEach((row, r) => [...row].forEach((ch, c) => {
      const kk = hm.get(r * 100 + c);
      g.fillStyle = kk !== undefined ? css(NAME_COLORS[kk]) : (r + c) % 2 ? '#262e44' : '#1b2131';
      g.fillRect(ox + c * 8, oy + r * 8, 7.5, 7.5);
      g.fillStyle = kk !== undefined ? '#10131a' : '#e9dfc6'; g.fillText(ch, ox + c * 8 + 4, oy + r * 8 + 4.3);
    }));
    g.strokeStyle = '#c9a85a'; g.lineWidth = 3; g.strokeRect(ox + 1.5, oy + 1.5, TS - 3, TS - 3);
    g.fillStyle = '#e8b84a'; g.font = 'bold 40px Georgia, serif'; g.fillText(k, ox + TS / 2, oy + TS / 2);
    g.font = 'bold 7px Georgia, serif';
  });

  }

    const b0 = fi * nv;

  const verts = []; for (let m = 0; m < 16; m++) verts.push([0, 1, 2, 3].map(b => (m >> b & 1) ? 1 : -1));
  const edges = []; for (let m = 0; m < 16; m++) for (let b = 0; b < 4; b++) if (!(m >> b & 1)) edges.push([m, m | (1 << b)]);
  const eArr = new Float32Array(edges.length * 6), eGeo = new THREE.BufferGeometry(); eGeo.setAttribute('position', new THREE.BufferAttribute(eArr, 3));

// ---------------------------------------------------------------- ICOSAHEDRON
function buildIco() {
  const phi = (1 + Math.sqrt(5)) / 2, SCL = 16;

  const F = [];

    const d = (a, b) => Math.abs(P[a].distanceTo(P[b]) - 2 * SCL) < 0.01;
    if (d(i, j) && d(j, k) && d(i, k)) F.push([i, j, k]);
  }
  const side = $('icSide').value, tris = [];
  for (let t = 29; t <= 38; t++) { const e = T[keyOf(t, side)]; const tr = triangles(e); tris.push({ e, rows: tr.up, tri: 'upper' }, { e, rows: tr.lo, tri: 'lower' }); }
  let n = 0; tris.forEach(t => t.rows.forEach(u => n += t.e.rows[u].length));
  const layer = new CellLayer(n);
  const X = new THREE.Vector3(), Y = new THREE.Vector3(), Z = new THREE.Vector3(), Q = new THREE.Vector3();
  const ep = [];
  F.forEach(([ia, ib, ic], fi) => {
    let A = P[ia], B = P[ib], Cc = P[ic];
    const nrm = new THREE.Vector3().subVectors(B, A).cross(new THREE.Vector3().subVectors(Cc, A));
    if (nrm.dot(new THREE.Vector3().add(A).add(B).add(Cc)) < 0) [B, Cc] = [Cc, B];
    ep.push(A, B, B, Cc, Cc, A);

    const M = new THREE.Vector3().addVectors(B, Cc).multiplyScalar(0.5);
    X.subVectors(Cc, B).normalize(); Y.subVectors(A, M).normalize(); Z.crossVectors(X, Y);
    const edgeLen = B.distanceTo(Cc), height = A.distanceTo(M);
    t.rows.forEach((u, i) => {
      const row = t.e.rows[u], len = row.length, f = (i + 0.5) / nr;
      const cw = edgeLen * f / len, sz = Math.min(cw, height / nr) * 0.95;
      const L = new THREE.Vector3().lerpVectors(A, B, f), R = new THREE.Vector3().lerpVectors(A, Cc, f);
      [...row].forEach((ch, j) => {

  legend([['Upper triangle', C.warm], ['Lower triangle', C.cool]]);
}

// ---------------------------------------------------------------- legend / UI
function legend(extra, names = true) {
  let h = '';
  if (names && $('hiNames').checked) h += '<div class="h">Master names</div>' + NAME_LEGEND.map(([n, c]) => `<div class="it"><i style="background:${css(c)}"></i>${n}</div>`).join('');
  if (extra.length) h += '<div class="h">This view</div>' + extra.map(([n, c]) => `<div class="it"><i style="background:${css(c)}"></i>${n}</div>`).join('');
  $('legend').innerHTML = h;
}
const fill = (sel, items) => { sel.innerHTML = items.map(([v, l]) => `<option value="${v}">${l}</option>`).join(''); };
fill($('hName'), [[8, 'any master name'], ...NAMES.map((n, i) => [i, n])]);
fill($('hLetter'), [...S.freq].map(L => [L, L]));
fill($('trSrc'), [['stack', `stack of ${S.sides.length} sides`], ...S.sides.map(k => [k, `side ${k}`])]);
fill($('clName'), [['all', 'all names'], ['CHASTOR', 'CHASTOR'], ['ANZACH', 'ANZACH'], ['GETH', 'GETH / ALGETH'], ['NOCHA', 'NOCHA / ADNOCHA'], ['ACLAX', 'ACLAX'], ['CHUSTOR', 'CHUSTOR']]);
fill($('tbl'), Array.from({ length: 47 }, (_, i) => [i + 2, `${i + 2} - ${T[keyOf(i + 2, 'a')].f === 'diamond' ? 'diamond' : 'square'}`]));
const baseKeys = Object.keys(T).filter(k => T[k].f === 'square-rows').sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b));
fill($('pBase'), baseKeys.map(k => [k, k]));
fill($('tsStart'), baseKeys.map(k => [k, k]));
const dTables = Array.from({ length: 20 }, (_, i) => [i + 29, String(i + 29)]);
fill($('pFace'), dTables); fill($('pFace2'), dTables);
$('pBase').value = '25a'; $('pFace').value = '29'; $('pFace2').value = '30';

const CAMS = {
  square: [[0, -8, 88], [0, 0, 0]], diamond: [[0, -6, 104], [0, 0, 0]],
  pyramid: [[62, 58, 92], [0, 8, 0]], book: [[0, -6, 92], [0, 0, 0]],
  heat: [[0, 78, 40], [0, 2, 4]], trail: [[0, 70, 46], [0, 0, 2]], closed: [[58, 46, 84], [0, 10, 0]],
  tess: [[42, 30, 80], [0, 0, 0]], ico: [[30, 24, 88], [0, 0, 0]],

let firstRender = true;
function render(keepCam = false) {
  clearView();
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  document.querySelectorAll('section[data-show]').forEach(s => s.hidden = !s.dataset.show.split(' ').includes(state.view));

    closed: buildClosed, tess: buildTess, ico: buildIco })[state.view]();
  if (!keepCam) {

}
function setView(v) {

}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.view));
$('tbl').onchange = () => {

  const isD = T[keyOf(state.table, 'a')].f === 'diamond';

};
$('side').onchange = () => { state.side = $('side').value; render(true); };
['currents', 'dlayout', 'hiNames', 'pBase', 'pFace', 'pFace2', 'showBase', 'hMode', 'hName', 'hLetter', 'hNull',
  'trSrc', 'trOrder', 'trObs', 'trNull', 'clName', 'clBase', 'tsStart', 'icSide'].forEach(id => $(id).onchange = () => render(true));
$('clGlow').oninput = () => { if (onSlider) onSlider(); };
$('icOcta').onchange = () => { if ($('icOcta').value) { $('icOcta').value = ''; $('octa').checked = true; $('fold').value = 0.15; state.view = 'pyramid'; render(); } };
$('octa').onchange = () => { $('fold').value = $('octa').checked ? 0.15 : 0; render(); };
$('gap').oninput = () => render(true);
['rot', 'fold'].forEach(id => $(id).oninput = () => { if (onSlider) onSlider(); if (id === 'rot' && state.view === 'diamond') caption.textContent = caption.textContent.replace(/turned \d+ deg/, `turned ${$('rot').value} deg`); });
$('toggle').onclick = () => $('panel').classList.toggle('closed');

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null, hovered = null, needPick = false;
renderer.domElement.addEventListener('pointermove', (ev) => { mouse.set(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1); needPick = true; });

renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;

});
function pick() {
  needPick = false;

    const hit = ray.intersectObjects(pickables)[0];
    const g = hit ? hit.object.parent : null;

    hovered = g;
    if (g) {
      g.scale.setScalar(1.1);

    $('hover').textContent = `row ${Math.floor(i / 49) + 1}, col ${i % 49 + 1}: ${f(heatPick.cur[i])} (${heatPick.nullOn ? 'observed' : 'null'} ${f(heatPick.other[i])})`;
    return;

  const inf = hit && hoverLayer.info[hit.instanceId];
  $('hover').textContent = inf ? `${inf.side ? inf.side + ' - ' : ''}row ${inf.r + 1}, col ${inf.c + 1}: ${inf.ch}${inf.k !== undefined ? '  [' + NAMES[inf.k] + ']' : ''}` : '';

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 0.9);
    const k = fly.t * fly.t * (3 - 2 * fly.t);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.q0, fly.q1, k);
    if (fly.t >= 1) fly = null;
  }
  tickers.forEach(f => f(t));
  controls.update();
  if (needPick) pick();
  renderer.render(scene, camera);
});

// initial view (supports #view=diamond&table=33&side=b for direct links)
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get('table')) state.table = +hp.get('table');
if (hp.get('side')) state.side = hp.get('side');
if (hp.get('currents')) $('currents').checked = true;
if (hp.get('octa')) $('octa').checked = true;
if (hp.get('layout')) $('dlayout').value = hp.get('layout');
for (const [k, v] of hp) {           // any control by id, e.g. #view=heat&hMode=letter&hLetter=X&hNull=1
  const el = document.getElementById(k);
  if (el && el.type === 'checkbox') el.checked = v === '1'; else if (el && 'value' in el) el.value = v;

render();
