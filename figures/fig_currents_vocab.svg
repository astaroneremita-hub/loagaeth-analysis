<svg xmlns="http://www.w3.org/2000/svg" width="660" height="452" viewBox="0 0 660 452" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Two currents, two vocabularies</title><rect x="0" y="0" width="660" height="452" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Two currents, two vocabularies</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Tables 25b–28b are written as two interleaved texts that do not share the same words.</text><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Shared recurring 5-grams between the two currents of 25b–28b (Jaccard)</text><text x="24" y="104" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">the two currents</text><rect x="290" y="92" width="184.8" height="16" rx="3" fill="#BA7517"/><text x="480.8" y="105" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.231</text><text x="24" y="130" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">random halves of the same lines (mean)</text><rect x="290" y="118" width="265.6" height="16" rx="3" fill="#B4B2A9"/><text x="561.6" y="131" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.332</text><text x="24" y="156" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">random halves (lowest of 100)</text><rect x="290" y="144" width="245.6" height="16" rx="3" fill="#D3D1C7"/><text x="541.6" y="157" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.307</text><text x="24" y="180" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Names on each current (↘ down-right | ← leftward)</text><text x="24" y="205" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">CHASTOR</text><rect x="245.0" y="194" width="15.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="194" width="25.0" height="14" rx="2" fill="#1D9E75"/><text x="239.0" y="205" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">6</text><text x="295.0" y="205" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">10</text><text x="24" y="227" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ANZACH</text><rect x="230.0" y="216" width="30.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="216" width="7.5" height="14" rx="2" fill="#1D9E75"/><text x="224.0" y="227" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">12</text><text x="277.5" y="227" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">3</text><text x="24" y="249" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">GETH</text><rect x="100.0" y="238" width="160.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="238" width="97.5" height="14" rx="2" fill="#1D9E75"/><text x="94.0" y="249" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">64</text><text x="367.5" y="249" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">39</text><text x="24" y="271" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">NOCHA</text><rect x="160.0" y="260" width="100.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="260" width="80.0" height="14" rx="2" fill="#1D9E75"/><text x="154.0" y="271" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">40</text><text x="350.0" y="271" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">32</text><text x="24" y="293" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ACLAX</text><rect x="197.5" y="282" width="62.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="282" width="27.5" height="14" rx="2" fill="#1D9E75"/><text x="191.5" y="293" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">25</text><text x="297.5" y="293" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">11</text><text x="24" y="315" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">CHADAX</text><rect x="245.0" y="304" width="15.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="304" width="12.5" height="14" rx="2" fill="#1D9E75"/><text x="239.0" y="315" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">6</text><text x="282.5" y="315" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">5</text><text x="24" y="337" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">OXAD</text><rect x="152.5" y="326" width="107.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="326" width="37.5" height="14" rx="2" fill="#1D9E75"/><text x="146.5" y="337" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">43</text><text x="307.5" y="337" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">15</text><text x="24" y="359" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">NOCHAP</text><rect x="240.0" y="348" width="20.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="348" width="32.5" height="14" rx="2" fill="#1D9E75"/><text x="234.0" y="359" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">8</text><text x="302.5" y="359" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">13</text><text x="24" y="381" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ALGETH</text><rect x="212.5" y="370" width="47.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="370" width="40.0" height="14" rx="2" fill="#1D9E75"/><text x="206.5" y="381" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">19</text><text x="310.0" y="381" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">16</text><text x="24" y="403" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">ADNOCHA</text><rect x="237.5" y="392" width="22.5" height="14" rx="2" fill="#534AB7"/><rect x="264" y="392" width="30.0" height="14" rx="2" fill="#1D9E75"/><text x="231.5" y="403" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">9</text><text x="300.0" y="403" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">12</text><text x="24" y="418" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">The two currents share fewer formulas than any random split of the same lines: two vocabularies,</text><text x="24" y="434" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">with ANZACH, ACLAX, OXAD leaning ↘ and NOCHAP, CHASTOR leaning ← — like the two houses.</text></svg>