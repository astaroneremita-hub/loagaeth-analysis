<svg xmlns="http://www.w3.org/2000/svg" width="706" height="324" viewBox="0 0 706 324" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Peterson's Index Verborum, checked line by line</title><rect x="0" y="0" width="706" height="324" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Peterson's Index Verborum, checked line by line</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Almost every reference lands on the stated line; the differences are old readings (Z/X, U/B, N/U).</text><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">3589 line references of the index (2779 entries), checked against our transcription</text><rect x="24" y="88" width="568.7378099749234" height="22" rx="2" fill="#534AB7"/><rect x="592.7378099749234" y="88" width="16.383393702981333" height="22" rx="2" fill="#AFA9EC"/><rect x="609.1212036779048" y="88" width="11.869601560323211" height="22" rx="2" fill="#BA7517"/><rect x="620.990805238228" y="88" width="3.0091947617720813" height="22" rx="2" fill="#D85A30"/><rect x="24" y="124" width="12" height="12" rx="2" fill="#534AB7"/><text x="42" y="134" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">found as a word on the stated line: 3402 (94.8%)</text><rect x="24" y="144" width="12" height="12" rx="2" fill="#AFA9EC"/><text x="42" y="154" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">inside a dense / longer token: 98 (2.7%)</text><rect x="24" y="164" width="12" height="12" rx="2" fill="#BA7517"/><text x="42" y="174" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">variant reading (1–2 letters differ): 71 (2.0%)</text><rect x="24" y="184" width="12" height="12" rx="2" fill="#D85A30"/><text x="42" y="194" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">not found: 18 (0.5%)</text><text x="24" y="226" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Line map, leaf 1b: index line → our row (purple = same row, amber = one row lower)</text><rect x="24" y="236" width="10" height="18" rx="1" fill="#534AB7"/><text x="29" y="270" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">1</text><rect x="36" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="48" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="60" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="72" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="84" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="96" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="108" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="120" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="132" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="144" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="156" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="168" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="180" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="192" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="204" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="216" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="228" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="240" y="236" width="10" height="18" rx="1" fill="#534AB7"/><rect x="252" y="236" width="10" height="18" rx="1" fill="#534AB7"/><text x="257" y="270" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">20</text><rect x="264" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="276" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="288" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="300" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="312" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="324" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="336" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="348" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="360" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="372" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="384" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="396" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="408" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="420" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="432" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="444" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="456" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="468" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="480" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="492" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="504" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="516" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="528" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="540" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="552" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="564" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="576" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="588" y="236" width="10" height="18" rx="1" fill="#BA7517"/><rect x="600" y="236" width="10" height="18" rx="1" fill="#BA7517"/><text x="605" y="270" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">49</text><text x="24" y="290" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Manuscript line 20 of leaf 1b is split over two rows in the transcription, so 1b also has 49 lines.</text><text x="24" y="306" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">The index covers only leaf 1 (t1 = 1a, t2 = 1b) and carries no meanings: it is a concordance.</text></svg>