<svg xmlns="http://www.w3.org/2000/svg" width="783" height="400" viewBox="0 0 783 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>How far does a letter 'know' its neighbours?</title><rect x="0" y="0" width="783" height="400" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">How far does a letter 'know' its neighbours?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Mutual information between letters d apart (bits, log scale).</text><line x1="70" y1="300" x2="610" y2="300" stroke="#C3C2B7"/><line x1="70" y1="80" x2="70" y2="300" stroke="#C3C2B7"/><text x="70.0" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">1</text><text x="160.0" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">2</text><text x="250.00000000000003" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">4</text><text x="340.0" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">8</text><text x="430.00000000000006" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">16</text><text x="520.0" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">32</text><text x="610.0" y="316" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">64</text><text x="64" y="258.403942648107" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">0.01</text><text x="64" y="171.2019713240535" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">0.1</text><text x="64" y="84.0" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="400">1</text><polyline points="70.0,87.5 160.0,122.9 212.6,143.7 250.0,168.1 279.0,198.5 302.6,219.3 340.0,247.2 369.0,267.4 392.6,271.3 430.0,277.0 459.0,271.9 482.6,275.0 520.0,274.4 572.6,269.0 575.3,265.8 577.9,265.3 610.0,274.4" fill="none" stroke="#534AB7" stroke-width="2"/><polyline points="70.0,87.2 160.0,122.1 212.6,142.2 250.0,177.5 279.0,211.3 302.6,231.9 340.0,271.3 369.0,286.4 392.6,294.2 430.0,296.4 459.0,296.4 482.6,292.1 520.0,295.3 572.6,290.1 575.3,294.2 577.9,294.2 610.0,297.6" fill="none" stroke="#D85A30" stroke-width="2"/><polyline points="70.0,275.7 160.0,276.4 212.6,281.4 250.0,277.0 279.0,273.7 302.6,279.9 340.0,273.1 369.0,275.0 392.6,275.0 430.0,279.2 459.0,275.0 482.6,273.7 520.0,273.7 572.6,273.7 575.3,279.2 577.9,276.4 610.0,271.9" fill="none" stroke="#B4B2A9" stroke-width="2"/><rect x="70" y="332" width="12" height="12" rx="2" fill="#534AB7"/><text x="88" y="342" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Loagaeth (tables 2–25a)</text><rect x="257" y="332" width="12" height="12" rx="2" fill="#D85A30"/><text x="275" y="342" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Markov-3 surrogate</text><rect x="409" y="332" width="12" height="12" rx="2" fill="#B4B2A9"/><text x="427" y="342" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">letters shuffled inside each side</text><text x="70" y="366" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Distance in letters (log). From 4 to ~12 letters the text remembers more than a 3-letter model: the length of</text><text x="70" y="382" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">its words and names. Beyond that, all memory is the change of letter mix from side to side — no long-range code.</text></svg>