<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas dos Nomes do Loagaeth</title>
<style>
  :root{--bg:#0b0e13;--panel:#141a22;--ink:#e6edf3;--mut:#8b97a7;--line:#262e3a;--gold:#e8c35a;--red:#e0573b;
    --fogo:#e0573b;--terra:#c9a24b;--ar:#5bb3e0;--agua:#3d6bd6;--skel:#c9b89a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,Segoe UI,Roboto,Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:8px 14px 6px} h1{font-size:17px;margin:0} .sub{color:var(--mut);font-size:11px;margin:1px 0 0}
  .bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
  .grp{display:flex;gap:4px;align-items:center} .grp b{color:var(--mut);font-weight:600;font-size:11px;margin-right:2px}
  button{background:#1b2634;border:1px solid #2c3a4e;color:var(--ink);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
  button.on{background:#2e4668;border-color:#4a6aa0} button:hover{filter:brightness(1.2)}
  input[type=text]{background:#0b1118;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px;font:12px monospace;width:120px}
  label.ck{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center}
  #wrap{flex:1;position:relative} svg{width:100%;height:100%;display:block;cursor:grab} svg:active{cursor:grabbing}
  .count{font-size:11px;color:var(--mut);margin-left:auto}
  .node text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#cdd6e0;pointer-events:none}
  #detail{position:absolute;top:10px;right:10px;width:234px;background:rgba(18,24,32,.96);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;display:none}
  #detail h3{margin:0 0 6px;font-size:14px;font-family:monospace} #detail .row{display:flex;justify-content:space-between;color:var(--mut);margin:2px 0}
  #detail .row span{color:var(--ink)} #detail .cx{color:var(--mut);font-size:11px;margin-top:6px;word-break:break-word} #detail b.nb{color:var(--gold);cursor:pointer}
  .msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#1b2330;border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .3s}
  .timeline{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);border-top:1px solid var(--line)}
  .timeline input[type=range]{flex:1} .tlab{font-size:12px;color:var(--gold);font-family:monospace;min-width:150px}
  .legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--mut);padding:5px 14px;background:var(--panel);border-top:1px solid var(--line)}
  .sw{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:-1px;margin-right:3px}
  .axis{fill:var(--mut);font-size:10px} .axisline{stroke:var(--line);stroke-dasharray:2 3}
</style>
</head>
<body>
<header>
  <h1>Atlas dos Nomes do Loagaeth</h1>
  <p class="sub">Tudo num mapa: nomes, famílias, esqueletos, elementos e posição no livro. Arraste · zoom na roda · clique num nó.</p>
</header>
<div class="bar">
  <div class="grp"><b>Mapa</b>
    <button data-mode="constelacao" class="on">Constelação</button>
    <button data-mode="continentes">Continentes</button>
    <button data-mode="livro">Mapa do livro</button>
    <button data-mode="esqueleto">Esqueletos</button>
  </div>
  <div class="grp"><b>Cor</b>
    <button data-col="elem" class="on">Elemento</button><button data-col="casa">Casa</button>
  </div>
  <label class="ck"><input type="checkbox" id="poss"> +possíveis (<span id="npos">…</span>)</label>
  <label class="ck"><input type="checkbox" id="skel"> +esqueletos</label>
  <label class="ck"><input type="checkbox" id="teia"> teia</label>
  <div class="grp">
    <input type="text" id="search" placeholder="buscar…" autocomplete="off">
    <input type="text" id="forge" placeholder="forjar…" autocomplete="off"><button id="bforge">Forjar</button>
  </div>
  <span class="count" id="count"></span>
</div>
<div id="wrap"><div class="msg" id="msg"></div><div id="detail"></div></div>
<div class="timeline">
  <button id="play">▶ linha do tempo</button>
  <input type="range" id="scrub" min="0" max="48" value="0">
  <span class="tlab" id="tlab">folha — (desligado)</span>
</div>
<div class="legend" id="legend"></div>

      return here?1:(before?.3:(d.kind==="poss"?.07:.12));})
    .attr("stroke",d=>f&&(d.folhas||[]).includes(f)?"var(--gold)":(d.kind==="forge"?"var(--gold)":d.bridge?"var(--red)":"#0b0e13"))
    .attr("stroke-width",d=>f&&(d.folhas||[]).includes(f)?2.4:(d.kind==="forge"?2.5:d.bridge?1.5:.6));
  const cnt=nameNodes().filter(d=>(d.folhas||[]).includes(f)).length;
  document.getElementById("tlab").textContent=f?`folha ${f} — ${cnt} nomes acendem`:"folha — (desligado)";}
const scrub=document.getElementById("scrub");
scrub.addEventListener("input",()=>{TL=+scrub.value;applyTL();});
let playTimer=null;
document.getElementById("play").onclick=function(){
  if(playTimer){clearInterval(playTimer);playTimer=null;this.textContent="▶ linha do tempo";return;}
  this.textContent="⏸ pausar"; if(TL>=48||TL===0)TL=1;
  playTimer=setInterval(()=>{TL++;if(TL>48){TL=1;} scrub.value=TL;applyTL();},700);};

function buildLegend(){const leg=document.getElementById("legend");leg.innerHTML="";
  const items = COLBY==="elem" ? ELEMS.map(e=>[e,ECOL[e]]) : HKEYS.map(h=>[h,HCOL[h]]);
  items.forEach(([k,c])=>{const s=document.createElement("span");s.innerHTML=`<span class="sw" style="background:${c}"></span>${k}`;leg.appendChild(s);});
  const x=document.createElement("span");x.innerHTML=`<span class="sw" style="background:var(--red)"></span>ponte · <span class="sw" style="background:var(--skel)"></span>esqueleto · <span style="color:var(--gold)">dourado=forjado</span> · tamanho=recorrência`;leg.appendChild(x);}

buildLegend(); base();
window.addEventListener("resize",()=>render(false));
</script>
