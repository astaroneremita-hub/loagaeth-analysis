<svg xmlns="http://www.w3.org/2000/svg" width="670" height="318" viewBox="0 0 670 318" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Is the end of the book 'denser'?</title><rect x="0" y="0" width="670" height="318" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Is the end of the book 'denser'?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Letter value and information per letter, by segment.</text><text x="60" y="74" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Mean Golden Dawn value per letter</text><rect x="60" y="174.64423076923077" width="46" height="65.35576923076923" rx="3" fill="#534AB7"/><text x="83" y="168.64423076923077" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">39</text><text x="83" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">opening</text><rect x="130" y="163.26923076923077" width="46" height="76.73076923076924" rx="3" fill="#534AB7"/><text x="153" y="157.26923076923077" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">46</text><text x="153" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">heartland</text><rect x="200" y="139.03846153846155" width="46" height="100.96153846153847" rx="3" fill="#534AB7"/><text x="223" y="133.03846153846155" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">60</text><text x="223" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">diamonds</text><rect x="270" y="100.0" width="46" height="140.0" rx="3" fill="#534AB7"/><text x="293" y="94.0" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">83</text><text x="293" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">end</text><text x="380" y="74" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Information per letter (bits)</text><rect x="380" y="171.07692307692304" width="40" height="68.92307692307695" rx="3" fill="#1D9E75"/><text x="400" y="165.07692307692304" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4.07</text><text x="400" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">opening</text><rect x="442" y="196.9230769230769" width="40" height="43.076923076923094" rx="3" fill="#1D9E75"/><text x="462" y="190.9230769230769" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">3.95</text><text x="462" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">heartland</text><rect x="504" y="171.07692307692304" width="40" height="68.92307692307695" rx="3" fill="#1D9E75"/><text x="524" y="165.07692307692304" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4.07</text><text x="524" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">diamonds</text><rect x="566" y="100.0" width="40" height="140.0" rx="3" fill="#1D9E75"/><text x="586" y="94.0" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4.40</text><text x="586" y="256" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">end</text><text x="24" y="284" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">End denser than heartland in 10 of 14 measures (Bonferroni); with U turned back into A only 3 remain.</text><text x="24" y="300" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">The rise is carried mostly by the A→U shift (U = 400, A = 1 in the Golden Dawn table).</text></svg>