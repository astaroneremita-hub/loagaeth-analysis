<svg xmlns="http://www.w3.org/2000/svg" width="660" height="446" viewBox="0 0 660 446" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Machine or language?</title><rect x="0" y="0" width="660" height="446" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Machine or language?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">The Soyga table is generated by a rule (periodic); the Loagaeth reads like a language.</text><text x="24" y="76" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">A character language model trained on tables 2–24: bits per letter (lower = it understands)</text><text x="24" y="100" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">held-out heartland</text><rect x="210" y="88" width="124.245" height="17" rx="3" fill="#534AB7"/><text x="340.245" y="101" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">3.01</text><text x="24" y="126" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">tables 25b–28 on diagonals</text><rect x="210" y="114" width="142.3125" height="17" rx="3" fill="#BA7517"/><text x="358.3125" y="127" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">3.45</text><text x="24" y="152" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">diamonds 29–43</text><rect x="210" y="140" width="154.48125000000002" height="17" rx="3" fill="#1D9E75"/><text x="370.48125000000005" y="153" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">3.75</text><text x="24" y="178" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">end 44–48 with U→A</text><rect x="210" y="166" width="175.1475" height="17" rx="3" fill="#378ADD"/><text x="391.14750000000004" y="179" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">4.25</text><text x="24" y="204" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">end 44–48 as written</text><rect x="210" y="192" width="208.35375000000002" height="17" rx="3" fill="#85B7EB"/><text x="424.35375" y="205" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">5.05</text><text x="24" y="230" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">tables 26–28 by rows</text><rect x="210" y="218" width="314.325" height="17" rx="3" fill="#D85A30"/><text x="530.325" y="231" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.62</text><text x="24" y="256" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">shuffled letters</text><rect x="210" y="244" width="309.705" height="17" rx="3" fill="#B4B2A9"/><text x="525.7049999999999" y="257" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.51</text><text x="24" y="292" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Periodicity (best self-match at a fixed period): machine vs language</text><text x="24" y="316" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Soyga Aries, column 1 (period 4)</text><rect x="270" y="304" width="290.7" height="16" rx="3" fill="#BA7517"/><text x="566.7" y="317" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.97</text><text x="24" y="340" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Soyga Aries, column 2 (period 4)</text><rect x="270" y="328" width="262.5" height="16" rx="3" fill="#BA7517"/><text x="538.5" y="341" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.88</text><text x="24" y="364" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Soyga Aries, column 3 (period 4)</text><rect x="270" y="352" width="253.2" height="16" rx="3" fill="#BA7517"/><text x="529.2" y="365" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.84</text><text x="24" y="388" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Loagaeth rows</text><rect x="270" y="376" width="59.1" height="16" rx="3" fill="#534AB7"/><text x="335.1" y="389" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.20</text><text x="24" y="412" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Loagaeth shuffled</text><rect x="270" y="400" width="50.400000000000006" height="16" rx="3" fill="#B4B2A9"/><text x="326.4" y="413" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.17</text></svg>