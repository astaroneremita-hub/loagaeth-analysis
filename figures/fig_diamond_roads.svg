<svg xmlns="http://www.w3.org/2000/svg" width="747" height="380" viewBox="0 0 747 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Is there another way to read the diamonds?</title><rect x="0" y="0" width="747" height="380" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Is there another way to read the diamonds?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Lower bits = the model recognises the language.</text><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Diamond pairs 29–43 rebuilt as squares, read every way (letter model of the heartland)</text><text x="24" y="104" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">anti-diagonals ↙ (r+c)</text><rect x="230" y="92" width="152.99625" height="16" rx="3" fill="#BA7517"/><text x="388.99625000000003" y="105" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">3.71 bits · names 9.9/1000</text><text x="24" y="128" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">anti-diagonals ↗</text><rect x="230" y="116" width="251.25375" height="16" rx="3" fill="#B4B2A9"/><text x="487.25374999999997" y="129" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">6.09 bits · names 0.0/1000</text><text x="24" y="152" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">rows R→L</text><rect x="230" y="140" width="318.3675" height="16" rx="3" fill="#B4B2A9"/><text x="554.3675000000001" y="153" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.72 bits · names 0.03/1000</text><text x="24" y="176" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">spiral</text><rect x="230" y="164" width="319.52250000000004" height="16" rx="3" fill="#B4B2A9"/><text x="555.5225" y="177" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.75 bits · names 0.03/1000</text><text x="24" y="200" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">boustrophedon</text><rect x="230" y="188" width="320.05875000000003" height="16" rx="3" fill="#B4B2A9"/><text x="556.05875" y="201" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.76 bits · names 0.03/1000</text><text x="24" y="224" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">columns down</text><rect x="230" y="212" width="320.76" height="16" rx="3" fill="#B4B2A9"/><text x="556.76" y="225" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.78 bits · names 0.03/1000</text><text x="24" y="248" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">diagonals ↘ (r−c)</text><rect x="230" y="236" width="320.8425" height="16" rx="3" fill="#B4B2A9"/><text x="556.8425" y="249" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.78 bits · names 0.0/1000</text><text x="24" y="272" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">rows L→R</text><rect x="230" y="260" width="321.29625" height="16" rx="3" fill="#B4B2A9"/><text x="557.29625" y="273" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.79 bits · names 0.0/1000</text><text x="24" y="296" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">columns up</text><rect x="230" y="284" width="322.20375" height="16" rx="3" fill="#B4B2A9"/><text x="558.20375" y="297" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.81 bits · names 0.0/1000</text><text x="24" y="320" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">diagonals ↖</text><rect x="230" y="308" width="322.40999999999997" height="16" rx="3" fill="#B4B2A9"/><text x="558.41" y="321" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">7.82 bits · names 0.0/1000</text><text x="24" y="346" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Only one road reads: the anti-diagonals, in the direction they are stored. Every other path is noise</text><text x="24" y="362" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">(≈ 7.8 bits, no names); the same road backwards keeps the information but loses every name.</text></svg>