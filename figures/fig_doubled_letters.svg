<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>The no-doubled-letter rule</title><rect x="0" y="0" width="800" height="290" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">The no-doubled-letter rule</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Share of adjacent identical letters. The Loagaeth avoids them far below chance — when read in its own direction.</text><text x="24" y="95" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Loagaeth full tables</text><rect x="200" y="83" width="25.936107687932505" height="18" rx="3" fill="#534AB7"/><text x="231.93610768793252" y="97" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.76%</text><text x="24" y="129" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Loagaeth diamond tables</text><rect x="200" y="117" width="14.674376718172336" height="18" rx="3" fill="#1D9E75"/><text x="220.67437671817234" y="131" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.43%</text><text x="24" y="163" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Leaf 1 (prophecy)</text><rect x="200" y="151" width="20.817139065314247" height="18" rx="3" fill="#B4B2A9"/><text x="226.81713906531425" y="165" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.61%</text><text x="24" y="197" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">The 48 Calls</text><rect x="200" y="185" width="63.13394634562516" height="18" rx="3" fill="#378ADD"/><text x="269.1339463456252" y="199" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">1.85%</text><text x="24" y="231" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Tables 26–28 read on diagonals</text><rect x="200" y="219" width="52.21347995070622" height="18" rx="3" fill="#BA7517"/><text x="258.2134799507062" y="233" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">1.53%</text><text x="24" y="265" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Tables 26–28 read by rows (wrong)</text><rect x="200" y="253" width="327.2727272727272" height="18" rx="3" fill="#D85A30"/><text x="533.2727272727273" y="267" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">9.59%</text><line x1="494" y1="72" x2="494" y2="252" stroke="#2C2C2A" stroke-dasharray="4 3"/><text x="494.17006351312915" y="268" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">chance 8.6%</text></svg>