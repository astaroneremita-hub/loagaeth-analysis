<svg xmlns="http://www.w3.org/2000/svg" width="799" height="328" viewBox="0 0 799 328" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Where the book holds DAHAHOXOM</title><rect x="0" y="0" width="799" height="328" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Where the book holds DAHAHOXOM</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Overlapping 3/4-letter fragments, density in the opening tables vs random names (a68).</text><text x="24" y="76" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Share of each form's scattered letter-material that falls in the opening tables (leaves 2–6).</text><line x1="267.8571428571429" y1="86" x2="267.8571428571429" y2="274" stroke="#C3C2B7" stroke-width="1" stroke-dasharray="3 3"/><text x="267.8571428571429" y="88" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">opening = 12% of book</text><line x1="252.14285714285714" y1="86" x2="252.14285714285714" y2="274" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/><text x="252.14285714285714" y="276" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">random names 10%</text><rect x="180" y="104" width="201.42857142857142" height="20" rx="2" fill="#7F77DD"/><text x="172" y="119" font-size="12" fill="#2C2C2A" text-anchor="end" font-weight="400">DAHAHOXOM</text><text x="389.42857142857144" y="119" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">28%  (z 3.1)</text><rect x="180" y="138" width="263.57142857142856" height="20" rx="2" fill="#D85A30"/><text x="172" y="153" font-size="12" fill="#2C2C2A" text-anchor="end" font-weight="400">AHOXOM</text><text x="451.57142857142856" y="153" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">37%  (z 4.7)</text><rect x="180" y="172" width="250.71428571428572" height="20" rx="2" fill="#7F77DD"/><text x="172" y="187" font-size="12" fill="#2C2C2A" text-anchor="end" font-weight="400">HAHOXOM</text><text x="438.7142857142857" y="187" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">35%  (z 4.3)</text><rect x="180" y="206" width="216.42857142857142" height="20" rx="2" fill="#7F77DD"/><text x="172" y="221" font-size="12" fill="#2C2C2A" text-anchor="end" font-weight="400">DAHAHOX</text><text x="404.42857142857144" y="221" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">30%  (z 3.5)</text><rect x="180" y="240" width="253.57142857142858" height="20" rx="2" fill="#7F77DD"/><text x="172" y="255" font-size="12" fill="#2C2C2A" text-anchor="end" font-weight="400">DAHOXOM</text><text x="441.57142857142856" y="255" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">36%  (z 4.4)</text><text x="24" y="294" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">DAHAHOXOM is written nowhere, but its scattered letters gather at the book's opening (peak leaf 2a) — far more than</text><text x="24" y="309" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">any random or real name. The core AHOXOM, the part actually heard in evocation, concentrates most. A pointer, not a proof.</text></svg>