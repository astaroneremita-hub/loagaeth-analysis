<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tábua do Loagaeth — Torre das Entidades</title>
<style>
:root{--bg:#f7f6f1;--card:#fff;--ink:#1b1a17;--mut:#6c6b62;--line:#e4e2d8;
 --fogo:#c0392b;--terra:#6b8e23;--ar:#2f80c0;--agua:#1f7a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13120c;--card:#1b1a13;--ink:#ece9da;--mut:#9a988a;--line:#322f27;--fogo:#e06a5a;--terra:#a7c65a;--ar:#6ab6e0;--agua:#5ac4b0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;max-width:940px;margin:0 auto;padding:16px 18px 50px}
h1{font-size:22px;font-weight:700;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.tablet{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.quad{border:2px solid;border-radius:12px;padding:10px 12px;background:var(--card)}
.quad.Ar{border-color:var(--ar)}.quad.Fogo{border-color:var(--fogo)}.quad.Agua{border-color:var(--agua)}.quad.Terra{border-color:var(--terra)}
.quad h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.quad.Ar h2{color:var(--ar)}.quad.Fogo h2{color:var(--fogo)}.quad.Agua h2{color:var(--agua)}.quad.Terra h2{color:var(--terra)}
.quad .dom{font-size:11px;color:var(--mut);margin-bottom:8px}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-family:ui-monospace,monospace;font-size:13px;background:var(--bg)}
.cell b{font-weight:700}.cell .f{color:var(--mut);font-size:10px;font-family:system-ui}
.cell.king{font-size:15px;font-weight:700;border-width:2px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);border-radius:50%;width:90px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 6px var(--bg)}
.center .n{font-family:ui-monospace,monospace;font-weight:700;font-size:16px}
.center .t{font-size:9px;opacity:.8}
.warn{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:9px 13px;font-size:12px;color:var(--mut);margin:12px 0}
@media(max-width:640px){.tablet{grid-template-columns:1fr}.center{display:none}}
#lang{cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:3px 12px;font-size:12px;font-weight:600;float:right}
</style>
</head>
<body>
<span id="lang">EN</span>
<h1 data-en="Tablet of the Loagaeth">Tábua do Loagaeth</h1>
<p class="sub" data-en="An Enochian-style Tower built from the names we found — the entities spread across the 4 elements, the strongest at the core. The king of each quadrant = the strongest name of its element.">Uma Torre estilo enoquiano montada com os nomes que achamos — as entidades distribuídas pelos 4 elementos, as mais fortes no cerne. O rei de cada quadrante = o nome mais forte do seu elemento.</p>
<div class="warn" id="warn"></div>
<div class="tablet" id="tab"></div>
<script>
var LAB={
 pt:{Ar:{nome:'Ar — Leste',dom:'mente · palavra · conhecimento',arc:'Raphael'},Fogo:{nome:'Fogo — Sul',dom:'vontade · força · ação',arc:'Michael'},Agua:{nome:'Água — Oeste',dom:'emoção · fluxo · vínculo',arc:'Gabriel'},Terra:{nome:'Terra — Norte',dom:'matéria · corpo · estabilidade',arc:'Uriel'}},
 en:{Ar:{nome:'Air — East',dom:'mind · word · knowledge',arc:'Raphael'},Fogo:{nome:'Fire — South',dom:'will · force · action',arc:'Michael'},Agua:{nome:'Water — West',dom:'emotion · flow · bond',arc:'Gabriel'},Terra:{nome:'Earth — North',dom:'matter · body · stability',arc:'Uriel'}}
};
var ORDER=['Ar','Fogo','Agua','Terra'],NAMES=null;
fetch('name_translation.json').then(r=>r.json()).then(d=>{NAMES=d.names;build()}).catch(()=>{document.getElementById('tab').innerHTML='Open via http://localhost:8860/';});
window.onLangChange=function(){if(NAMES)build()};
function build(){
 var names=NAMES,en=window.LANG==='en',LB=LAB[en?'en':'pt'];
 document.getElementById('warn').textContent=en
   ?'Honest: the spread across the 4 elements and the "king" of each quadrant are an ORGANIZATION we impose (by the already-measured element and force of the names) — not a received historical Tablet. It is our names arranged in the Enochian manner, for use.'
   :'Honesto: a distribuição pelos 4 elementos e o "rei" de cada quadrante são uma ORGANIZAÇÃO que nós impomos (pelo elemento e força já medidos dos nomes) — não é uma Tábua histórica recebida. É os nossos nomes arrumados à moda enoquiana, para uso.';
 var by={Ar:[],Fogo:[],Agua:[],Terra:[]};
 names.forEach(x=>{if(by[x.whole_element])by[x.whole_element].push(x)});
 var ent=en?'entities':'entidades',arcw=en?'archangel':'arcanjo';
 var h='';
 ORDER.forEach(el=>{
  var list=by[el].sort((a,b)=>(b.force||0)-(a.force||0));
  var L=LB[el];
  h+='<div class="quad '+el+'"><h2>'+L.nome+'</h2><div class=dom>'+L.dom+' · '+arcw+' '+L.arc+' · '+list.length+' '+ent+'</div><div class=cells>';
  list.forEach((x,i)=>{h+='<span class="cell'+(i===0?' king':'')+'">'+(i===0?'♔ ':'')+'<b>'+x.name+'</b> <span class=f>'+(x.force||'—')+'</span></span>';});
  h+='</div></div>';
 });
 document.getElementById('tab').innerHTML=h+'<div class=center><div class=n>NOCHA</div><div class=t>'+(en?'the Word · core':'o Verbo · cerne')+'</div></div>';
}
</script>
<script src="i18n.js"></script>
</body>
</html>
