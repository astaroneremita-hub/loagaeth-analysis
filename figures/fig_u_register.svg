<svg xmlns="http://www.w3.org/2000/svg" width="652" height="320" viewBox="0 0 652 320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>The end of the book speaks the heartland's names in a U register</title><rect x="0" y="0" width="652" height="320" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">The end of the book speaks the heartland's names in a U register</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Only replacing A by U brings the two segments together; other vowel swaps push them apart.</text><text x="24" y="89" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">as written</text><rect x="150" y="77" width="176.74418604651163" height="18" rx="3" fill="#B4B2A9"/><text x="332.74418604651163" y="91" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">228</text><text x="24" y="119" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">A→E</text><rect x="150" y="107" width="113.17829457364341" height="18" rx="3" fill="#D3D1C7"/><text x="269.1782945736434" y="121" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">146</text><text x="24" y="149" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">A→I</text><rect x="150" y="137" width="128.68217054263565" height="18" rx="3" fill="#D3D1C7"/><text x="284.6821705426356" y="151" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">166</text><text x="24" y="179" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">A→O</text><rect x="150" y="167" width="131.0077519379845" height="18" rx="3" fill="#D3D1C7"/><text x="287.0077519379845" y="181" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">169</text><text x="24" y="209" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">A→U</text><rect x="150" y="197" width="300.0" height="18" rx="3" fill="#534AB7"/><text x="456.0" y="211" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">387</text><text x="24" y="246" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">Recurring 5-grams of the end tables (44–48) also found in the heartland (6–25):</text><text x="24" y="270" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">CHAST → CHUST</text><text x="174" y="270" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">ASTOR → USTOR</text><text x="324" y="270" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">PHICH → PHICH</text><text x="474" y="270" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">HASTO → HUSTO</text><text x="24" y="290" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">RANCH → RUNCH</text><text x="174" y="290" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">RONPH → RONPH</text><text x="324" y="290" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">ICHAS → ICHUS</text><text x="474" y="290" font-size="12" fill="#3C3489" text-anchor="start" font-weight="400">VANCH → VUNCH</text></svg>