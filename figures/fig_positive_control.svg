<svg xmlns="http://www.w3.org/2000/svg" width="836" height="354" viewBox="0 0 836 354" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Would our tests see sentences? A positive control</title><rect x="0" y="0" width="836" height="354" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Would our tests see sentences? A positive control</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">The King James Bible cut exactly like the tables, run through the same three blind tests.</text><text x="30" y="80" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Each test detects sentence structure. English scores high; the tables and the no-syntax controls do not.</text><rect x="30" y="242.875" width="26" height="7.125" rx="2" fill="#2C2C2A"/><text x="43.0" y="237.875" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">2</text><rect x="60" y="191.125" width="26" height="58.875" rx="2" fill="#378ADD"/><text x="73.0" y="186.125" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">16</text><rect x="90" y="250.0" width="26" height="0.0" rx="2" fill="#B4B2A9"/><text x="103.0" y="245.0" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">0</text><rect x="120" y="248.5" width="26" height="1.5" rx="2" fill="#D3D1C7"/><text x="133.0" y="243.5" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">0</text><text x="90" y="266" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">next unit tied</text><text x="90" y="279" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">to previous</text><rect x="210" y="233.125" width="26" height="16.875" rx="2" fill="#2C2C2A"/><text x="223.0" y="228.125" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">4</text><rect x="240" y="212.5" width="26" height="37.5" rx="2" fill="#378ADD"/><text x="253.0" y="207.5" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">10</text><rect x="270" y="248.125" width="26" height="1.875" rx="2" fill="#B4B2A9"/><text x="283.0" y="243.125" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">0</text><rect x="300" y="250.0" width="26" height="0.0" rx="2" fill="#D3D1C7"/><text x="313.0" y="245.0" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">0</text><text x="270" y="266" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">order of</text><text x="270" y="279" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">lines matters</text><rect x="390" y="230.125" width="26" height="19.875" rx="2" fill="#2C2C2A"/><text x="403.0" y="225.125" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">5</text><rect x="420" y="108.25" width="26" height="141.75" rx="2" fill="#378ADD"/><text x="433.0" y="103.25" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">38</text><rect x="450" y="246.625" width="26" height="3.375" rx="2" fill="#B4B2A9"/><text x="463.0" y="241.625" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">1</text><rect x="480" y="245.5" width="26" height="4.5" rx="2" fill="#D3D1C7"/><text x="493.0" y="240.5" font-size="9" fill="#5F5E5A" text-anchor="middle" font-weight="400">1</text><text x="450" y="266" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">echo over</text><text x="450" y="279" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="400">4 lines</text><rect x="30" y="300" width="12" height="12" rx="2" fill="#2C2C2A"/><text x="48" y="310" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Loagaeth tables</text><rect x="161" y="300" width="12" height="12" rx="2" fill="#378ADD"/><text x="179" y="310" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">English (Bible)</text><rect x="292" y="300" width="12" height="12" rx="2" fill="#B4B2A9"/><text x="310" y="310" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Bible, words shuffled</text><rect x="465" y="300" width="12" height="12" rx="2" fill="#D3D1C7"/><text x="483" y="310" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">random surrogate</text><text x="30" y="336" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">z-scores (bars capped at 40). The Loagaeth is not sentences — as the diary says: the reading is the appearing of the ministers.</text></svg>