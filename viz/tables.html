<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabelas do Loagaeth — nomes na grade</title>
<style>
:root{--bg:#f7f6f1;--card:#fff;--ink:#1b1a17;--mut:#6c6b62;--line:#e4e2d8;
--Fogo:#d85a30;--Terra:#b07d2a;--Ar:#2f7fd4;--Agua:#199e70}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13120c;--card:#1b1a13;--ink:#ece9da;--mut:#9a988a;--line:#322f27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;max-width:1120px;margin:0 auto;padding:16px 16px 50px}
h1{font-size:20px;font-weight:600;margin:0 0 2px;display:inline-block}
#lang{cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:3px 12px;font-size:12px;font-weight:600;float:right}
.sub{color:var(--mut);margin:0 0 10px;font-size:13px}
.calls,.modes{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.cb,.mb{padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer;font-size:12px;font-weight:600}
.cb.on,.mb.on{background:var(--ink);color:var(--bg)}
.layout{display:flex;gap:16px;flex-wrap:wrap}
.gridwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;flex:1;min-width:300px}
svg{display:block;width:100%;height:auto}
.side{width:250px;flex-shrink:0}
.side h3{font-size:13px;margin:4px 0 8px;color:var(--mut)}
.nlist{max-height:540px;overflow:auto}
.ni{padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.ni:hover{background:var(--bg)}.ni.on{outline:1px solid var(--ink)}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:6px 0}
.cnt{color:var(--mut);font-size:12px}
.gl{color:var(--mut);font-style:italic}
</style>
</head>
<body>
<span id="lang">EN</span>
<h1 id="h1">Tabelas do Loagaeth — os nomes na grade original</h1>
<p class="sub" id="sub">Escolha um quadrado e um modo de leitura. Reta, diagonal e traçado (king-move) mostram os nomes; sentido mostra as palavras das Chamadas com tradução de Dee.</p>
<div class="modes" id="modes"></div>
<input id="find" placeholder="buscar qualquer palavra na folha (ex. OLGEM)…" style="width:100%;max-width:420px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;margin-bottom:10px">
<div class="calls" id="leaves"></div>
<div class="leg" id="leg"></div>
<div class="layout">
 <div class="gridwrap"><svg id="grid" viewBox="0 0 640 640"></svg></div>
 <div class="side"><h3 id="sideh">—</h3><div class="nlist" id="nlist"></div></div>
</div>
<script>
var ELH={Fogo:'#d85a30',Terra:'#b07d2a',Ar:'#2f7fd4',Agua:'#199e70','?':'#8a8a8a'};
var T=null,cur=null,iso=null,mode='reta',findWord='',SVG='http://www.w3.org/2000/svg',LG=(localStorage.getItem('atlas_lang')||'pt');
function findOcc(g,w){var R=49,out=[];if(w.length<2)return out;var forms=[[w,false]];if(w!==w.split('').reverse().join(''))forms.push([w.split('').reverse().join(''),true]);
 function scan(cells){var s=cells.map(c=>g[c[0]][c[1]]).join('');forms.forEach(f=>{var j=s.indexOf(f[0]);while(j>=0){out.push(cells.slice(j,j+w.length));j=s.indexOf(f[0],j+1)}})}
 for(var r=0;r<R;r++)scan(Array.from({length:R},(_,c)=>[r,c]));
 for(var c=0;c<R;c++)scan(Array.from({length:R},(_,r)=>[r,c]));
 for(var s=0;s<R;s++){scan(Array.from({length:R-s},(_,k)=>[s+k,k]));if(s>0)scan(Array.from({length:R-s},(_,k)=>[k,s+k]));scan(Array.from({length:R-s},(_,k)=>[s+k,R-1-k]));if(s>0)scan(Array.from({length:R-s},(_,k)=>[k,R-1-s-k]))}
 return out}
var STR={pt:{h1:'Tabelas do Loagaeth — os nomes na grade original',sub:'Escolha um quadrado e um modo de leitura. Reta, diagonal e traçado (king-move) mostram os nomes; sentido mostra as palavras das Chamadas com tradução de Dee.',lang:'EN',
 modes:{reta:'reta',diag:'diagonal',trace:'traçado',meaning:'sentido',todos:'todos juntos'},els:['Fogo','Terra','Ar','Água'],occ:'ocorrências',names:'nomes',words:'palavras'},
 en:{h1:'Loagaeth tables — the names on the original grid',sub:'Pick a square and a reading mode. Straight, diagonal and traced (king-move) show the names; meaning shows the translated Call words.',lang:'PT',
 modes:{reta:'straight',diag:'diagonal',trace:'traced',meaning:'meaning',todos:'all together'},els:['Fire','Earth','Air','Water'],occ:'occurrences',names:'names',words:'words'}};
function S(k){return STR[LG][k]}
fetch('table_grids.json').then(r=>r.json()).then(d=>{T=d;boot()}).catch(e=>{document.getElementById('grid').outerHTML='<p>Sirva por HTTP: python -m http.server 8860</p>'});
function boot(){
 document.getElementById('lang').onclick=()=>{LG=LG==='pt'?'en':'pt';localStorage.setItem('atlas_lang',LG);applyLang();draw()};
 var mb=document.getElementById('modes');
 ['reta','diag','trace','meaning','todos'].forEach(m=>{var b=document.createElement('span');b.className='mb'+(m===mode?' on':'');b.dataset.m=m;b.onclick=()=>{mode=m;iso=null;[...mb.children].forEach(c=>c.classList.toggle('on',c.dataset.m===m));draw()};mb.appendChild(b)});
 var box=document.getElementById('leaves');
 T.order.forEach(lf=>{var b=document.createElement('span');b.className='cb';b.textContent=lf;b.onclick=()=>pick(lf);box.appendChild(b)});
 var fp=new URLSearchParams(location.search).get('find');
 document.getElementById('find').addEventListener('input',e=>{findWord=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');jumpToFind();draw()});
 if(fp){findWord=fp.toUpperCase().replace(/[^A-Z]/g,'');document.getElementById('find').value=findWord;}
 applyLang();pick(T.order.includes('2b')?'2b':T.order[0]);
 if(findWord){jumpToFind();draw();}
}
function applyLang(){document.getElementById('h1').textContent=S('h1');document.getElementById('sub').textContent=S('sub');document.getElementById('lang').textContent=S('lang');
 [...document.querySelectorAll('#modes .mb')].forEach(b=>b.textContent=S('modes')[b.dataset.m]);
 var cols=['--Fogo','--Terra','--Ar','--Agua'];document.getElementById('leg').innerHTML=S('els').map((e,i)=>'<span><span class="sw" style="background:var('+cols[i]+')"></span>'+e+'</span>').join('');}
function pick(lf){cur=lf;iso=null;[...document.getElementById('leaves').children].forEach(c=>c.classList.toggle('on',c.textContent===lf));draw()}
function leavesWith(w){var out=[];if(w.length<2)return out;T.order.forEach(lf=>{var fo=findOcc(T.leaves[lf].grid,w);if(fo.length)out.push([lf,fo.length])});return out}
function jumpToFind(){if(!findWord)return;var lw=leavesWith(findWord);if(lw.length&&!lw.some(x=>x[0]===cur)){cur=lw[0][0];[...document.getElementById('leaves').children].forEach(c=>c.classList.toggle('on',c.textContent===cur))}}
function items(){var L=T.leaves[cur];return mode==='reta'?L.straight:mode==='diag'?L.diag:mode==='trace'?L.trace:L.meanings}
function cellsOf(o){if(o.cells)return o.cells;var out=[];for(var k=0;k<o.len;k++)out.push([o.row,o.col+k]);return out}
function layers(){var L=T.leaves[cur];
 if(mode==='reta')return[{list:L.straight,kind:'rect',m:'reta'}];
 if(mode==='diag')return[{list:L.diag,kind:'line',m:'diagonal'}];
 if(mode==='trace')return[{list:L.trace,kind:'line',m:'traçado'}];
 if(mode==='meaning')return[{list:L.meanings,kind:'rect',m:'sentido'}];
 return[{list:L.straight,kind:'rect',m:'reta'},{list:L.diag,kind:'line',m:'diagonal'},{list:L.trace,kind:'line',m:'traçado'},{list:L.meanings,kind:'rect',m:'sentido'}];}
function draw(){
 var L=T.leaves[cur],g=L.grid,svg=document.getElementById('grid');svg.innerHTML='';var cell=640/49;
 var lys=layers(),counts={},meta={},totalocc=0;
 lys.forEach(ly=>{ly.list.forEach(o=>{
  var key=o.word||o.name;if(iso&&key!==iso)return;totalocc++;
  var col=o.word?'#8a6d2f':ELH[o.element];var cells=cellsOf(o);
  counts[key]=(counts[key]||0)+1;meta[key]={o:o,col:col,meaning:o.meaning};
  if(ly.kind==='line'){
   var pts=cells.map(c=>((c[1]+0.5)*cell).toFixed(1)+','+((c[0]+0.5)*cell).toFixed(1)).join(' ');
   var pl=document.createElementNS(SVG,'polyline');pl.setAttribute('points',pts);pl.setAttribute('fill','none');pl.setAttribute('stroke',col);pl.setAttribute('stroke-width',iso?2.4:1.4);pl.setAttribute('stroke-opacity',iso?0.95:0.55);pl.setAttribute('stroke-linejoin','round');pl.setAttribute('stroke-linecap','round');svg.appendChild(pl);
  }else{
   cells.forEach(c=>{var rc=document.createElementNS(SVG,'rect');rc.setAttribute('x',(c[1]*cell).toFixed(1));rc.setAttribute('y',(c[0]*cell).toFixed(1));rc.setAttribute('width',cell.toFixed(1));rc.setAttribute('height',cell.toFixed(1));rc.setAttribute('rx',1.5);rc.setAttribute('fill',col);rc.setAttribute('fill-opacity',iso?0.55:0.3);svg.appendChild(rc)});
  }
 });});
 for(var r=0;r<49;r++)for(var c=0;c<49;c++){var t=document.createElementNS(SVG,'text');t.setAttribute('x',(c*cell+cell/2).toFixed(1));t.setAttribute('y',(r*cell+cell*0.72).toFixed(1));t.setAttribute('text-anchor','middle');t.setAttribute('font-size',(cell*0.7).toFixed(1));t.setAttribute('fill','var(--ink)');t.setAttribute('opacity',0.8);t.style.fontFamily='ui-monospace,monospace';t.textContent=g[r][c];svg.appendChild(t);}
 if(findWord){var fo=findOcc(g,findWord);fo.forEach(cells=>{var pts=cells.map(c=>((c[1]+0.5)*cell).toFixed(1)+','+((c[0]+0.5)*cell).toFixed(1)).join(' ');var pl=document.createElementNS(SVG,'polyline');pl.setAttribute('points',pts);pl.setAttribute('fill','none');pl.setAttribute('stroke','#e24bb0');pl.setAttribute('stroke-width',3);pl.setAttribute('stroke-opacity',0.95);pl.setAttribute('stroke-linejoin','round');pl.setAttribute('stroke-linecap','round');svg.appendChild(pl);var s=cells[0];var d=document.createElementNS(SVG,'circle');d.setAttribute('cx',((s[1]+0.5)*cell).toFixed(1));d.setAttribute('cy',((s[0]+0.5)*cell).toFixed(1));d.setAttribute('r',3);d.setAttribute('fill','#e24bb0');svg.appendChild(d)});
  document.getElementById('sideh').textContent=cur+' — "'+findWord+'": '+fo.length+'×';
  document.getElementById('nlist').innerHTML=fo.map(cells=>{var a=cells[0],b=cells[cells.length-1];var dir=(a[0]===b[0]?'reta':a[1]===b[1]?'coluna':'diagonal');return '<div class=ni><span><span class=sw style="background:#e24bb0"></span>'+dir+'</span><span class=cnt>l'+a[0]+' c'+a[1]+'</span></div>'}).join('')||'<div class=ni>—</div>';
  return;}
 var keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
 document.getElementById('sideh').textContent=cur+' — '+keys.length+' '+(mode==='meaning'?S('words'):S('names'))+', '+totalocc+' '+S('occ');
 document.getElementById('nlist').innerHTML=keys.map(k=>{var mm=meta[k];
  var extra=mm.meaning?' <span class=gl>'+mm.meaning+'</span>':'';
  return '<div class="ni'+(iso===k?' on':'')+'" onclick="iso=(iso===\''+k.replace(/[^A-Za-z]/g,"")+'\'?null:\''+k.replace(/[^A-Za-z]/g,"")+'\');draw()"><span><span class=sw style="background:'+mm.col+'"></span>'+k+extra+'</span><span class=cnt>'+counts[k]+'×</span></div>'}).join('');
}
window.draw=draw;
</script>
</body>
</html>
