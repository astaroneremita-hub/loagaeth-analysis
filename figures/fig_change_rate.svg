<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>How fast does the language change?</title><rect x="0" y="0" width="720" height="402" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">How fast does the language change?</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Amber dashes = the data-driven borders of a27.</text><line x1="50" y1="230" x2="650" y2="230" stroke="#C3C2B7"/><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Distance between each side and the next (letter models reading each other, bits)</text><polyline points="50.0,132.2 56.5,125.3 63.0,131.0 69.6,141.3 76.1,149.0 82.6,155.2 89.1,141.2 95.7,150.2 102.2,147.8 108.7,147.0 115.2,138.6 121.7,143.8 128.3,154.1 134.8,141.0 141.3,140.1 147.8,153.3 154.3,153.5 160.9,157.6 167.4,153.1 173.9,142.2 180.4,158.4 187.0,165.9 193.5,168.0 200.0,165.6 206.5,168.6 213.0,172.4 219.6,172.6 226.1,158.1 232.6,161.3 239.1,162.5 245.7,164.5 252.2,169.5 258.7,161.0 265.2,152.6 271.7,157.6 278.3,161.6 284.8,175.4 291.3,114.5 297.8,90.0 304.3,171.0 310.9,164.6 317.4,159.3 323.9,150.6 330.4,167.9 337.0,158.3 343.5,126.5 350.0,145.9 356.5,149.1 363.0,164.7 369.6,164.4 376.1,172.9 382.6,164.3 389.1,158.9 395.7,131.2 402.2,157.5 408.7,149.9 415.2,149.6 421.7,118.0 428.3,149.5 434.8,134.8 441.3,139.6 447.8,134.3 454.3,128.8 460.9,129.5 467.4,124.8 473.9,133.7 480.4,129.3 487.0,127.5 493.5,133.1 500.0,102.8 506.5,131.5 513.0,131.8 519.6,113.2 526.1,125.0 532.6,132.0 539.1,128.6 545.7,127.7 552.2,103.3 558.7,94.3 565.2,100.2 571.7,124.8 578.3,105.2 584.8,101.6 591.3,118.1 597.8,115.1 604.3,112.2 610.9,107.4 617.4,99.2 623.9,96.2 630.4,112.1 637.0,109.2 643.5,96.2 650.0,114.2" fill="none" stroke="#534AB7" stroke-width="1.6"/><line x1="50" y1="90" x2="650" y2="90" stroke="#D85A30" stroke-dasharray="4,3"/><text x="646" y="86" font-size="10" fill="#D85A30" text-anchor="end" font-weight="400">random pair of sides: 1.707</text><line x1="190.21739130434784" y1="90" x2="190.21739130434784" y2="230" stroke="#BA7517" stroke-dasharray="2,3"/><text x="190.21739130434784" y="244" font-size="9" fill="#BA7517" text-anchor="middle" font-weight="400">12b|</text><line x1="353.26086956521743" y1="90" x2="353.26086956521743" y2="230" stroke="#BA7517" stroke-dasharray="2,3"/><text x="353.26086956521743" y="244" font-size="9" fill="#BA7517" text-anchor="middle" font-weight="400">25a|</text><line x1="457.60869565217394" y1="90" x2="457.60869565217394" y2="230" stroke="#BA7517" stroke-dasharray="2,3"/><text x="457.60869565217394" y="244" font-size="9" fill="#BA7517" text-anchor="middle" font-weight="400">33a|</text><line x1="555.4347826086956" y1="90" x2="555.4347826086956" y2="230" stroke="#BA7517" stroke-dasharray="2,3"/><text x="555.4347826086956" y="244" font-size="9" fill="#BA7517" text-anchor="middle" font-weight="400">40b|</text><text x="24" y="270" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Two interleaved halves: separate vocabularies? (shared recurring 5-grams, Jaccard)</text><text x="24" y="296" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">currents of 25b–28b</text><rect x="230" y="284" width="207.9" height="16" rx="3" fill="#BA7517"/><rect x="230" y="300" width="298.8" height="4" rx="1" fill="#B4B2A9"/><text x="534.8" y="297" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.231 (random split 0.332)</text><text x="24" y="322" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">a/b sides of diamonds 29–43</text><rect x="230" y="310" width="251.10000000000002" height="16" rx="3" fill="#1D9E75"/><rect x="230" y="326" width="249.3" height="4" rx="1" fill="#B4B2A9"/><text x="487.1" y="323" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.279 (random split 0.277)</text><text x="24" y="352" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">The language drifts in small steps (1.07 bits between neighbours vs 1.72 for random pairs); the largest</text><text x="24" y="368" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">jumps crowd into tables 40–48, where the U register begins. The currents are two vocabularies; the two</text><text x="24" y="384" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">colours of a diamond are one text split in two.</text></svg>