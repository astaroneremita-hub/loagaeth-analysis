<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>The CHASTOR hive</title><rect x="0" y="0" width="660" height="400" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">The CHASTOR hive</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">The root CHAST is carried inside every prefixed name (counts = how often each prefix precedes it).</text><line x1="330" y1="200" x2="330" y2="70" stroke="#7F77DD" stroke-width="4.5"/><line x1="330" y1="200" x2="422" y2="108" stroke="#7F77DD" stroke-width="1.8"/><line x1="330" y1="200" x2="460" y2="200" stroke="#7F77DD" stroke-width="1.5"/><line x1="330" y1="200" x2="422" y2="292" stroke="#7F77DD" stroke-width="1.2"/><line x1="330" y1="200" x2="330" y2="330" stroke="#7F77DD" stroke-width="0.8"/><line x1="330" y1="200" x2="238" y2="292" stroke="#7F77DD" stroke-width="0.8"/><line x1="330" y1="200" x2="200" y2="200" stroke="#7F77DD" stroke-width="0.7"/><line x1="330" y1="200" x2="238" y2="108" stroke="#7F77DD" stroke-width="0.7"/><rect x="278.0" y="53.0" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="330.0" y="69.0" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">NOCHASTOR</text><text x="330.0" y="82.0" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">77×</text><rect x="369.9238815542512" y="91.07611844574882" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="421.9238815542512" y="107.07611844574882" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">NECHASTOR</text><text x="421.9238815542512" y="120.07611844574882" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">24×</text><rect x="408.0" y="183.0" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="460.0" y="199.0" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">ZICHASTOR</text><text x="460.0" y="212.0" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">18×</text><rect x="369.9238815542512" y="274.9238815542512" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="421.9238815542512" y="290.9238815542512" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">NACHASTOR</text><text x="421.9238815542512" y="303.9238815542512" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">12×</text><rect x="278.0" y="313.0" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="330.0" y="329.0" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">PLICHASTOR</text><text x="330.0" y="342.0" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">5×</text><rect x="186.07611844574882" y="274.9238815542512" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="238.07611844574882" y="290.9238815542512" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">PRICHASTOR</text><text x="238.07611844574882" y="303.9238815542512" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">4×</text><rect x="148.0" y="183.00000000000003" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="200.0" y="199.00000000000003" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">PALCHASTOR</text><text x="200.0" y="212.00000000000003" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">2×</text><rect x="186.07611844574882" y="91.07611844574883" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/><text x="238.07611844574882" y="107.07611844574883" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="600">ARCHASTOR</text><text x="238.07611844574882" y="120.07611844574883" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">2×</text><circle cx="330" cy="200" r="46" fill="#FAEEDA" stroke="#BA7517"/><text x="330" y="198" font-size="15" fill="#633806" text-anchor="middle" font-weight="600">CHAST</text><text x="330" y="216" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="400">the root</text><text x="24" y="380" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Every subordinate = the queen's root + one prefix (its own mark). Shorter forms are more frequent.</text></svg>