<svg xmlns="http://www.w3.org/2000/svg" width="660" height="452" viewBox="0 0 660 452" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Two currents, two vocabularies</title><rect x="0" y="0" width="660" height="452" rx="10" fill="#FFFFFF" stroke="#E1E0D9"/><text x="24" y="32" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="600">Two currents, two vocabularies</text><text x="24" y="52" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Tables 25b–28b are written as two interleaved texts that do not share the same words.</text><text x="24" y="78" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Shared recurring 5-grams between the two currents of 25b–28b (Jaccard)</text><text x="24" y="104" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">the two currents</text><rect x="290" y="92" width="176.8" height="16" rx="3" fill="#BA7517"/><text x="472.8" y="105" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.221</text><text x="24" y="130" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">random halves of the same lines (mean)</text><rect x="290" y="118" width="252.0" height="16" rx="3" fill="#B4B2A9"/><text x="548.0" y="131" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.315</text><text x="24" y="156" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">random halves (lowest of 100)</text><rect x="290" y="144" width="230.39999999999998" height="16" rx="3" fill="#D3D1C7"/><text x="526.4" y="157" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">0.288</text><text x="24" y="180" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="600">Names on each current (↘ down-right | ← leftward)</text><text x="24" y="205" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">CHASTOR</text><rect x="245.0" y="194" width="15.0" height="14" rx="2" fill="#534AB7"/><rect x="264" y="194" 